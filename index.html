  };
}
function taihouSpeak(){
  var t=state.taihou;
  if(!t || t.dead) return '（太后已崩）';
  if(t.health<30) return '太后抱恙';
  if(t.mood>70) return '太后心情甚好';
  if(t.mood<30) return '太后不悦';
  return '太后安好';
}
function taihouOpinion(c){
  var t=state.taihou;
  if(t.favorite===c.id) return '太后偏爱';
  if(t.disliked===c.id) return '太后不喜';
  var score=0;
  var p=TAIHOU_PREFS[c.per];
  if(p) score+=p;
  if(c.fam==='江南书香世家'||c.fam==='翰林清流') score+=1;
  if(c.fam==='罪臣之后'||c.fam==='番邦贡女') score-=1;
  if(c.rankIdx<=7) score+=1;
  if(score>=1) return '太后印象尚可';
  if(score<=-1) return '太后不喜';
  return '太后无感';
}
function taihouDaily(){
  var t=state.taihou;
  if(!t) return;
  t.mood=clamp(t.mood+ri(-2,1),0,100);
  t.health=clamp(t.health+ri(-1,1),0,100);
  if(t.mood<30) t.moodLabel='不悦';
  else if(t.mood>70) t.moodLabel='欢喜';
  else t.moodLabel='安宁';
  // 太后偶尔召妃子训话
  if(Math.random()<0.15){
    var alive=state.consorts.filter(function(c){return c.alive&&!c.inColdPalace&&taihouOpinion(c)==='太后不喜';});    
  if(alive.length){
      var c=pick(alive);

  '张扬':{张扬:1,娇纵:1,妖媚:1,温婉:-1,端庄:-1,隐忍:-1}
};
function getCompat(a,b){
  var m=PER_COMPAT[a.per];
  if(!m) return 0;
  return m[b.per]||0;
}
function initRelations(){
  state.relations={}; // key: 'id1-id2' -> {score:-100~100, allies:bool, enemies:bool}
  state.consorts.forEach(function(a){
    state.consorts.forEach(function(b){
      if(a.id>=b.id) return;
      var key=a.id+'-'+b.id;
      var base=getCompat(a,b)*5 + ri(-10,10);
      state.relations[key]={score:base, a:a.id, b:b.id};
    });
  });
}
function getRel(a,b){
  var key=a<b?a+'-'+b:b+'-'+a;
  if(!state.relations[key]) state.relations[key]={score:0,a:a,b:b};
  return state.relations[key];
}
function relUpdateDaily(){
  Object.keys(state.relations).forEach(function(k){
    var r=state.relations[k];
    r.score=clamp(r.score+ri(-2,1),-100,100);
  });
}
function relLabel(score){
  if(score>=60) return '亲密';
  if(score>=30) return '友善';
  if(score>=-10) return '平常';
  if(score>=-40) return '不和';
  return '敌对';
}

// ==================== 宫斗事件链 ====================
function maybeStartConflictChain(){
  if(state.activeChain) return;
  if(Math.random()>0.08) return;
  var alive=state.consorts.filter(function(c){return c.alive;});
  if(alive.length<2) return;
  // 选两个关系最差的
  var pairs=[];
  alive.forEach(function(a){alive.forEach(function(b){ if(a.id<b.id){ var r=getRel(a.id,b.id); if(r.score<-20) pairs.push({a:a,b:b,r:r}); } });});
  if(!pairs.length) return;
  var p=pick(pairs);
  state.activeChain={
    step:1,
    aId:p.a.id,
    bId:p.b.id,
    type:pick(['poison','rumor','theft','plot']),
    log:[]
  };
  var a=p.a,b=p.b;
  var setups={
    poison:'宫中传来消息：'+a.name+'的茶盏中被人下毒，所幸发现及时。太医查验后，发现毒物来历不明。',
    rumor:'宫中流言四起，说'+a.name+'与侍卫有染，传得有鼻子有眼。'+a.name+'哭着来见你。',
    theft:'你赐给'+a.name+'的一件珍宝不翼而飞，最后在'+b.name+'的宫女房中被人发现。',
    plot:'有宫人告发'+b.name+'私下诅咒'+a.name+'，在'+b.name+'宫中搜出了一个写着生辰八字的布偶。'
  };
  state.activeChain.setup=setups[state.activeChain.type];
  state.logs.push('【宫斗】'+a.name+'与'+b.name+'之间起了风波。');
}
function runConflictChain(){
  if(!state.activeChain) return null;
  var ch=state.activeChain;
  var a=state.consorts.find(function(x){return x.id===ch.aId;});
  var b=state.consorts.find(function(x){return x.id===ch.bId;});
  if(!a||!b||!a.alive||!b.alive){ state.activeChain=null; return null; }
  return {a:a,b:b,ch:ch};
}
function resolveConflictChain(side){
  var data=runConflictChain();
  if(!data) return;
  var ch=data.ch,a=data.a,b=data.b;
  if(side==='close'){
    state.logs.push('【宫斗】'+a.name+'与'+b.name+'的风波暂未处置。');
    state.activeChain=null;
    state._chainShown=false;
    closeModal();
    render();
    return;
  }
  var r=getRel(a.id,b.id);
  var result='';  
  if(side==='a'){
    a.favor=clamp(a.favor+5,0,100);a.mood='得意';
    b.favor=clamp(b.favor-8,0,100);b.mood='怨恨';
    b.health=clamp(b.health-5,0,100);
    r.score=clamp(r.score-25,-100,100);
    if(b.rankIdx>3) b.rankIdx--;
    result='你信了'+a.name+'的话，'+b.name+'被降位罚俸，宫中人人自危。';
  }else if(side==='b'){
    b.favor=clamp(b.favor+5,0,100);b.mood='得意';
    a.favor=clamp(a.favor-8,0,100);a.mood='怨恨';
    a.health=clamp(a.health-5,0,100);
    r.score=clamp(r.score-25,-100,100);
    if(a.rankIdx>3) a.rankIdx--;
    result='你信了'+b.name+'的话，'+a.name+'被降位罚俸，宫中议论纷纷。';
  }else if(side==='both'){
    a.favor=clamp(a.favor-3,0,100);a.mood='幽怨';
    b.favor=clamp(b.favor-3,0,100);b.mood='幽怨';
    a.health=clamp(a.health-3,0,100);b.health=clamp(b.health-3,0,100);
    r.score=clamp(r.score-10,-100,100);

function investigateConflict(){
  var data=runConflictChain();
  if(!data) return;
  var a=data.a,b=data.b;
  // 随机决定真凶（宫斗中没有明确指向，五五开）
  var culprit, victim;
  if(Math.random()<0.5){ culprit=a; victim=b; } else { culprit=b; victim=a; }
  state.pendingConflictInvestigation = {
    culpritId: culprit.id,
    victimId: victim.id,
    startXun: absXun()
  };
  state.activeChain=null;
  state._chainShown=false;
  state.logs.push('【宫斗】皇上派人暗中调查'+a.name+'与'+b.name+'之间的风波，约一旬后出结果。');
  alert('你派人暗中调查，约一旬后出结果。');
  closeModal();render();
}
function tickConflictInvestigation(){
  var inv = state.pendingConflictInvestigation;
  if(!inv) return;
  if(absXun() - inv.startXun < 1) return;
  state.pendingConflictInvestigation = null;
  var culprit = state.consorts.find(function(x){return x.id===inv.culpritId;});
  var victim = state.consorts.find(function(x){return x.id===inv.victimId;});
  if(!culprit || !victim) return;
  // 智力越高越容易逃脱
  var chance = 0.7;
  if(culprit.intel>80) chance = 0.3;
  else if(culprit.intel>60) chance = 0.5;
  if(culprit.ambition>80) chance += 0.1;
  var exposed = Math.random()<chance;
  state._conflictInvResult = {culpritId:inv.culpritId, victimId:inv.victimId, exposed:exposed};
  var html='<h4>🔍 宫斗调查结果</h4>';
  if(exposed){
    html+='<div style="color:#c9b48a;font-size:13px;line-height:1.8;margin-bottom:12px;border-left:3px solid #c9a227;padding-left:10px">经一番暗查，真相大白：<br>'+culprit.name+'（'+RANKS[culprit.rankIdx]+'）确为此事主谋，'+victim.name+'（'+RANKS[victim.rankIdx]+'）受冤。</div>';
    html+='<div style="color:#e8c96a;font-size:13px;margin-bottom:8px">如何处置？</div>';
    html+='<button class="choice" onclick="resolveConflictInvestigation(\'punish\')">依律严惩</button>';
    html+='<button class="choice" onclick="resolveConflictInvestigation(\'lenient\')">从轻发落</button>';
    html+='<button class="choice" onclick="resolveConflictInvestigation(\'ignore\')">压下此事</button>';
  } else {
    html+='<div style="color:#c9b48a;font-size:13px;line-height:1.8;margin-bottom:12px;border-left:3px solid #6a5a3a;padding-left:10px">查了一旬，未得实据，此事只得不了了之。</div>';
    html+='<button class="choice" onclick="resolveConflictInvestigation(\'none\')">罢了</button>';
  }
  openModal(html);
}
function resolveConflictInvestigation(action){
  var r = state._conflictInvResult;
  if(!r){closeModal();return;}
  var culprit = state.consorts.find(function(x){return x.id===r.culpritId;});
  var victim = state.consorts.find(function(x){return x.id===r.victimId;});
  if(!culprit || !victim){closeModal();return;}
  culprit.memories=culprit.memories||[];
  victim.memories=victim.memories||[];
  var msg='';
  if(action==='punish' && r.exposed){
    if(culprit.rankIdx<RANKS.length-1) culprit.rankIdx++;
    culprit.power=clamp(culprit.power-10,0,100);
    culprit.favor=clamp(culprit.favor-15,0,100);
    culprit.mood='怨恨';
    culprit.memories.push('【事发】设计陷害'+victim.name+'，被皇上查办降位。');
    victim.mood='得意';
    victim.memories.push('皇上为自己洗冤，'+culprit.name+'被查办。');
    msg='依律严惩，'+culprit.name+'被降位。';
  } else if(action==='lenient' && r.exposed){
    culprit.power=clamp(culprit.power-3,0,100);
    culprit.favor=clamp(culprit.favor-5,0,100);
    culprit.memories.push('【事发】设计'+victim.name+'之事被查，皇上从轻发落。');
    victim.mood='幽怨';
    victim.memories.push('皇上从轻发落此事，心中不平。');
    msg='从轻发落，'+culprit.name+'受了薄惩。';
  } else if(action==='ignore' && r.exposed){
    culprit.memories.push('【事发】被皇上查明，但皇上压下不问。');
    victim.memories.push('皇上压下此事，不再追究。');
    msg='你将此事压下。';
  } else {
    msg='查无实据，此事不了了之。';
    victim.memories.push('此事终无结果。');
  }
  state.logs.push('【宫斗调查】'+msg);
  alert(msg);
  state._conflictInvResult=null;
  closeModal();
  assignPalaces();updateFactionPower();
  render();
}

function tickFactionPlot(){
  if(Math.random()>0.12) return;
  if(state.pendingInvestigation) return;
  var alive=state.consorts.filter(function(c){return c.alive&&!c.inColdPalace;});
  if(alive.length<3) return;
  var fwm=state.factions.filter(function(f){return f.leader && f.leader.alive && f.members.length>0;});
  if(fwm.length<2) return;
  var f1=pick(fwm);
  var f2=pick(fwm.filter(function(f){return f.id!==f1.id;}));
  if(!f1||!f2) return;
  var numAttackers = Math.min(f1.members.length, ri(1,3));
  var attackerPool = f1.members.slice().sort(function(){return Math.random()-0.5;});
  var attackers = [];
  for(var i=0;i<numAttackers;i++){
    var cx = state.consorts.find(function(x){return x.id===attackerPool[i];});
    if(cx && cx.alive && !cx.inColdPalace) attackers.push(cx);
  }
  if(!attackers.length) return;

    text='宫中搜出一件失窃之物，就在'+victimName+'的宫中。'+victimName+'被指偷窃，好感-'+dmg+'。';
    msg='东西藏得刻意，似有人做局。';

    text=victimName+'宫中首饰失窃数件，损失银钱约'+(dmg*100)+'两。';
    msg='失窃案惊动了管事太监。';
  }

  html+='<div style="white-space:pre-line;color:#c9b48a;font-size:13px;line-height:1.8;margin-bottom:12px;border-left:3px solid #c94a5a;padding-left:10px">'+text+'\n\n'+msg+'</div>';
  html+='<div style="font-size:12px;color:#9a8c78;margin-bottom:10px">受害者：'+victimName+'<br>蛛丝马迹：似与'+f1.name+'有关（'+f1.members.length+'人）</div>';
  html+='<div style="color:#e8c96a;font-size:13px;margin-bottom:8px">你打算怎么办？</div>';
  var ids = attackers.map(function(a){return a.id;}).join(',');
  html+='<button class="choice" onclick="startInvestigation('+victim.id+',['+ids+'])">派人暗中调查（一旬后出结果）</button>';
  html+='<button class="choice" onclick="resolveFactionPlot('+victim.id+','+attackers[0].id+',\'comfortB\')">安抚'+victim.name+'（国库-500）</button>';
  html+='<button class="choice" onclick="resolveFactionPlot('+victim.id+','+attackers[0].id+',\'ignore\')">不予理会</button>';
  openModal(html);
  state.logs.push('【宫斗】'+text);
  attackers.forEach(function(a){
    var r=getRel(a.id,victim.id);
    r.score=clamp(r.score-15,-100,100);
    a.memories=a.memories||[];
    a.memories.push('暗中对'+victim.name+'动了手脚。');
  });
  victim.memories=victim.memories||[];
  victim.memories.push('近日遇上风波，'+text);

function startInvestigation(victimId, attackerIds){

    startXun: absXun()
  };

  alert('你派人暗中调查，约一旬后出结果。');

}
function tickInvestigation(){
  if(!state.pendingInvestigation) return;
  if(absXun() - state.pendingInvestigation.startXun < 1) return;
  var inv = state.pendingInvestigation;
  state.pendingInvestigation = null;
  var victim = state.consorts.find(function(x){return x.id===inv.victimId;});
  var attackers = inv.attackerIds.map(function(id){return state.consorts.find(function(x){return x.id===id;});}).filter(function(x){return x;});
  if(!victim || !attackers.length){ return; }
  var exposed = [], hidden = [];
  attackers.forEach(function(a){
    var chance = 0.7;
    if(a.intel>80) chance = 0.3;
    else if(a.intel>60) chance = 0.5;
    if(a.ambition>80) chance += 0.1;
    if(Math.random()<chance) exposed.push(a);
    else hidden.push(a);
  });
  var html='<h4>🔍 调查结果</h4>';
  if(exposed.length){
    var names = exposed.map(function(a){return a.name+'（'+RANKS[a.rankIdx]+'）';}).join('、');
    html+='<div style="color:#c9b48a;font-size:13px;line-height:1.8;margin-bottom:12px;border-left:3px solid #c9a227;padding-left:10px">经一番暗查，真相大白：<br>'+names+' 参与了此事，罪证确凿。</div>';
    if(hidden.length){
      var hn = hidden.map(function(a){return a.name+'（'+RANKS[a.rankIdx]+'）';}).join('、');
      html+='<div style="color:#9a8c78;font-size:12px;margin-bottom:10px">另有 '+hn+' 疑有参与，但查无实据。</div>';
    }
    html+='<div style="color:#e8c96a;font-size:13px;margin-bottom:8px">如何处置？</div>';
    html+='<button class="choice" onclick="resolveInvestigation(\'punish\')">依律严惩</button>';
    html+='<button class="choice" onclick="resolveInvestigation(\'lenient\')">从轻发落</button>';
    html+='<button class="choice" onclick="resolveInvestigation(\'ignore\')">压下此事</button>';
  } else {
    var hn2 = hidden.map(function(a){return a.name+'（'+RANKS[a.rankIdx]+'）';}).join('、');
    html+='<div style="color:#c9b48a;font-size:13px;line-height:1.8;margin-bottom:12px;border-left:3px solid #6a5a3a;padding-left:10px">查了一旬，只查到些似是而非的线索，牵涉 '+hn2+'，却无实据。此事只得不了了之。</div>';
    html+='<button class="choice" onclick="resolveInvestigation(\'none\')">罢了</button>';
  }
  state._investigationResult = {exposed:exposed, hidden:hidden, victimId:victim.id};
  openModal(html);
}
function resolveInvestigation(action){
  var data = state._investigationResult;
  if(!data){ closeModal(); return; }
  var victim = state.consorts.find(function(x){return x.id===data.victimId;});
  var msg='';
  if(action==='punish'){
    data.exposed.forEach(function(a){
      if(a.rankIdx<RANKS.length-1) a.rankIdx = a.rankIdx+1;
      a.power = clamp(a.power-10, 0, 100);
      a.favor = clamp(a.favor-15, 0, 100);
      a.mood='怨恨';
      a.memories.push('【事发】暗中陷害'+victim.name+'之事败露，被降位。');
    });
    if(victim){
      victim.mood='得意';
      victim.memories.push('陷害自己的人被皇上查办，心中宽慰。');
    }
    msg='你下令依律严惩，'+data.exposed.length+'人受罚。';
  } else if(action==='lenient'){
    data.exposed.forEach(function(a){
      a.power = clamp(a.power-3, 0, 100);
      a.favor = clamp(a.favor-5, 0, 100);
      a.memories.push('【事发】陷害'+victim.name+'之事被查，皇上从轻发落。');
    });
    if(victim){
      victim.mood='幽怨';
      victim.memories.push('皇上从轻发落此事，心中不平。');
    }
    msg='你从轻发落，'+data.exposed.length+'人受了薄惩。';
  } else if(action==='ignore'){
    if(victim){
      victim.mood='幽怨';
      victim.memories.push('皇上压下此事，不再追究。');
    }
    msg='你将此事压下，不再追究。';
  } else {
    msg='查无实据，此事不了了之。';
    if(victim){
      victim.memories.push('此事终无结果。');
    }
  }
  state.logs.push('【调查】'+msg);
  alert(msg);
  state._investigationResult=null;
  closeModal();
  updateFactionPower();
  render();
}

function tickConsortInteraction(){
  if(state._pendingConsortEvent) return;
  var alive=state.consorts.filter(function(c){return c.alive && !c.inColdPalace && !c.pregnant && (c.groundedUntil||0)<=absXun();});
  if(alive.length<2) return;
  if(Math.random()>0.18) return;
  var r=Math.random();
  if(r<0.18) consortSwornSisters(alive);
  else if(r<0.32) consortMutualFrame(alive);
  else if(r<0.44) consortUnionAgainst(alive);
  else if(r<0.56) consortSeekPregnancy(alive);
  else if(r<0.68) consortPunishLowRank(alive);
  else if(r<0.80) consortTalentShowdown(alive);
  else consortLoveAffair(alive);
}
function consortSwornSisters(alive){
  var pairs=[];
  alive.forEach(function(a){
    alive.forEach(function(b){
      if(a.id>=b.id) return;
      var r=getRel(a.id,b.id);
      if(r.score<60) return;
      if(r.allies) return;
      // 60分10%，100分50%，线性插值
      var prob=0.10+(r.score-60)/40*0.40;
      if(Math.random()<prob) pairs.push({a:a,b:b,r:r});
    });
  });
  if(!pairs.length) return;
  var p=pick(pairs);
  p.r.allies=true;
  p.r.score=clamp(p.r.score+20,-100,100);
  p.a.memories.push('与'+p.b.name+'结为异姓姐妹。');
  p.b.memories.push('与'+p.a.name+'结为异姓姐妹。');
  state.logs.push('【后宫】'+p.a.name+'与'+p.b.name+'结为姐妹。');
  state._pendingConsortEvent={
    title:'后宫 · 义结金兰',
    text:p.a.name+'与'+p.b.name+'情投意合，在宫中焚香立誓，结为异姓姐妹，有福同享，有难同当。',
    choices:[
      {t:'嘉许她们（魅力+1）',f:function(){state.emperor.charm=clamp(state.emperor.charm+1,0,100);return '你嘉许了这对姐妹，宫中传为佳话。';}},
      {t:'不置可否',f:function(){return '你未做表态。';}}
    ]
  };
}
function consortMutualFrame(alive){
  var pairs=[];
  alive.forEach(function(a){
    alive.forEach(function(b){
      if(a.id>=b.id) return;
      var r=getRel(a.id,b.id);
      if(r.score<-20) pairs.push({a:a,b:b,r:r});
    });
  });
  if(!pairs.length) return;
  var p=pick(pairs);
  var a,b;
  if(Math.random()<0.5){a=p.a;b=p.b;} else {a=p.b;b=p.a;}
  var dmg=ri(3,8);
  var stat=pick(['health','power','charm']);
  b[stat]=clamp(b[stat]-dmg,0,100);
  b.mood='恼怒';
  p.r.score=clamp(p.r.score-15,-100,100);
  var statName={health:'体质',power:'势力',charm:'魅力'}[stat];
  a.memories.push('暗中陷害'+b.name+'，使其'+statName+'-'+dmg+'。');
  b.memories.push('遭'+a.name+'陷害，'+statName+'-'+dmg+'。');
  state.logs.push('【后宫】'+a.name+'暗中陷害'+b.name+'。');
  state._pendingConsortEvent={
    title:'后宫 · 暗中陷害',
    text:'有宫人密报：'+a.name+'暗中陷害'+b.name+'，'+b.name+'近来'+statName+'受损（-'+dmg+'），似与此有关。',
    choices:[
      {t:'彻查此事（一旬后出结果）',f:function(){state.pendingConsortFrame={attackerId:a.id,victimId:b.id,stat:stat,statName:statName,dmg:dmg,startXun:absXun()};return '你派人暗中调查，约一旬后出结果。';}},
      {t:'装聋作哑',f:function(){return '你未理会，宫中之争愈演愈烈。';}}
    ]
  };
}
function tickConsortFrame(){

    html+='<button class="choice" onclick="resolveConsortFrame(\'punish\')">小惩'+a.name+'（罚俸3旬，势力-5，好感-8）</button>';

  }

  openModal(html);
}
function resolveConsortFrame(action){
  var r=state._consortFrameResult;
  if(!r){closeModal();return;}
  var a=state.consorts.find(function(x){return x.id===r.attackerId;});
  var b=state.consorts.find(function(x){return x.id===r.victimId;});
  if(!a){state._consortFrameResult=null;closeModal();return;}
  var msg='';
  if(action==='punish' && r.exposed){
    a.power=clamp(a.power-5,0,100);

// ==================== 位分人数限制 ====================
function rankLimit(rankIdx){
  if(rankIdx===0) return 1;              // 皇后 1人
  if(rankIdx===1) return 1;              // 皇贵妃 1人
  if(rankIdx===2) return 2;              // 贵妃 2人
  if(rankIdx>=3 && rankIdx<=6) return 1; // 淑妃~庄妃各1人
  if(rankIdx===7) return 6;              // 妃 6人
  if(rankIdx>=8 && rankIdx<=19) return 1;// 昭仪~充媛 共1人
  return -1;                              // 其他不限
}
function countAtRankExcept(rankIdx, excludeId){
  if(rankIdx>=8 && rankIdx<=19){
    return state.consorts.filter(function(x){return x.alive && !x.inColdPalace && x.id!==excludeId && x.rankIdx>=8 && x.rankIdx<=19;}).length;
  }
  return state.consorts.filter(function(x){return x.alive && !x.inColdPalace && x.id!==excludeId && x.rankIdx===rankIdx;}).length;
}
function canPromoteTo(c, targetRank){
  if(targetRank<0) return false;
  var lim = rankLimit(targetRank);
  if(lim < 0) return true;
  return countAtRankExcept(targetRank, c.id) < lim;
}
function rankFullMsg(targetRank){
  if(targetRank>=8 && targetRank<=19) return '昭仪至充媛位已满（合计仅1人）';
  return RANKS[targetRank]+'位已满';
}

function coldPalaceCost(c){

  if(c.rankIdx>=22) return 0;          // 庶妃以下免消耗
  if(c.rankIdx>=8) return 10+(21-c.rankIdx)*3; // 昭仪~嫔，越高越贵
  return -1;                            // 妃及以上不允许
}
function doPunish(id,idx){
  var c=state.consorts.find(function(x){return x.id===id;});
  if(!c) return;
  var p=PUNISHMENTS[idx];
  var msg='';
  c.memories=c.memories||[];
  var curXun=absXun();
  if(p.f==='salary'){
    c.salaryUntil=curXun+p.v;
    var d=ri(1,5); c.power=clamp(c.power-d,0,100); c.favor=clamp(c.favor-ri(1,5),0,100);
    c.mood='幽怨';
    msg='罚俸'+p.v+'旬。势力-'+d+'，好感-'+ri(1,5)+'。';
  } else if(p.f==='ground'){
    c.groundedUntil=curXun+p.v;
    var s=ri(3,10),f=ri(1,8);
    c.power=clamp(c.power-s,0,100); c.favor=clamp(c.favor-f,0,100);
    c.mood='哀伤';
    msg='禁足'+p.v+'旬。势力-'+s+'，好感-'+f+'。';
  } else if(p.f==='copy'){
    var s=ri(1,3); c.power=clamp(c.power-s,0,100); c.mood='忧愁';
    msg='罚抄经书百卷。势力-'+s+'。';
  } else if(p.f==='kneel'){
    var s=ri(3,8); var f=ri(3,6);
    c.power=clamp(c.power-s,0,100); c.favor=clamp(c.favor-f,0,100);
    c.mood='哀伤';
    msg='罚跪'+p.v+'个时辰。势力-'+s+'，好感-'+f+'。';
  } else if(p.f==='slap'){
    var s=ri(4,8),f=ri(3,8),h=ri(1,6);
    c.power=clamp(c.power-s,0,100); c.favor=clamp(c.favor-f,0,100); c.charm=clamp(c.charm-h,0,100);
    c.mood='怨恨';
    msg='掌嘴。势力-'+s+'，好感-'+f+'，魅力-'+h+'。';
  } else if(p.f==='rod'){
    var v=p.v;
    var s,f,h;
    if(v===30){s=ri(5,10);f=ri(5,10);h=ri(5,10);}
    else if(v===50){s=ri(10,15);f=ri(10,15);h=ri(10,20);}
    else {s=ri(20,30);f=ri(20,30);h=ri(20,30);}
    c.power=clamp(c.power-s,0,100);
    c.favor=clamp(c.favor-f,0,100);
    c.health=clamp(c.health-h,0,100);
    c.mood='怨恨';
    msg='杖刑'+v+'。势力-'+s+'，好感-'+f+'，体质-'+h+'。';
    if(v===100 && Math.random()<0.3){
      c.alive=false;
      msg+=' 杖毙！'+c.name+'没能挺过来。';
    }
  }
  c.memories.push('【惩罚】'+msg);
  state.logs.push('【惩罚】'+c.name+'：'+msg);
  alert('【'+c.name+'】\n\n'+msg);
  if(!c.alive){
    closeModal();
    assignPalaces();updateFactionPower();render();
    return;
  }
  showDetail(id);render();
}

// 每旬冷宫/禁足/罚俸结算
function tickPunishment(){
  var curXun=absXun();
  state.consorts.filter(function(c){return c.alive;}).forEach(function(c){
    c.memories=c.memories||[];
    if(c.inColdPalace){
      c.power=clamp(c.power-ri(1,3),0,100);
      c.favor=clamp(c.favor-ri(0,2),0,100);

    if(c.groundedUntil>curXun){
      c.favor=clamp(c.favor-1,0,100);
      if(Math.random()<0.3) c.memories.push('禁足中，'+pick(['闭门思过','抄了几页经','望着院墙发怔'])+'。');

    // 势力不足不再自动降位，降位仅由皇帝手动操作。

function tickAging(){

    var reasons=[
      '岁月不饶人，'+c.name+'对镜梳妆，发觉鬓边多了几根白发。',
      '熬夜照看孩子，'+c.name+'近日气色有些差。',

    c.health=clamp(c.health-hReduce,0,100);

  assignPalaces();
  // 潜邸旧人各自创建派系
  state.consorts.filter(function(c){return c.alive && c.isFudi;}).forEach(function(c){
    createSect(c);
  });
}
function createSect(leader){
  if(!leader || !leader.alive) return null;
  if(leader.rankIdx > 7 && !leader.isFudi) return null;
  if(leader.faction !== -1 && leader.faction !== undefined) return null;
  var sid = state.factions.length;
  var sect = {
    id: sid,
    name: leader.name + '派',
    color: FACTION_COLORS[sid % FACTION_COLORS.length],
    power: 0,
    leader: leader,
    members: [leader.id],
    isEmpress: leader.rankIdx === 0
  };
  state.factions.push(sect);
  leader.faction = sid;
  return sect;
}
function updateFactionPower(){
  state.factions.forEach(function(f){
    if(!f.leader || !f.leader.alive){
      f.power = 0;
      f.members.forEach(function(mid){
        var m = state.consorts.find(function(c){return c.id === mid;});
        if(m) m.faction = -1;
      });
      f.members = [];
      return;
    }
    // 清理死亡成员
    f.members = f.members.filter(function(id){
      var c = state.consorts.find(function(x){return x.id === id;});
      return c && c.alive;
    });
    var otherPower = 0;
    f.members.forEach(function(id){
      if(id === f.leader.id) return;
      var m = state.consorts.find(function(x){return x.id === id;});
      if(m) otherPower += m.power;
    });
    // 派系势力 = 首脑势力*30% + 其他成员势力总和*20%
    f.power = Math.round(f.leader.power * 0.3 + otherPower * 0.2);
  });
}
function tickSectJoin(){
  var unjoined = state.consorts.filter(function(c){
    return c.alive && !c.inColdPalace && c.faction === -1;
  });
  unjoined.forEach(function(c){
    if(Math.random() > 0.20) return;
    var candidates = [];
    state.consorts.forEach(function(o){
      if(o.id === c.id || !o.alive || o.inColdPalace || o.faction === -1) return;
      var r = getRel(c.id, o.id);
      if(r.score > 40) candidates.push(o);
    });
    if(!candidates.length) return;
    var target = pick(candidates);
    var sect = state.factions.find(function(s){return s.id === target.faction;});
    if(!sect) return;
    sect.members.push(c.id);
    c.faction = sect.id;
    c.memories.push('加入'+sect.name+'。');
  });
}
function tickSectCreate(){
  var potential = state.consorts.filter(function(c){
    return c.alive && !c.inColdPalace && c.rankIdx <= 7 && c.faction === -1;
  });
  potential.forEach(function(c){
    if(Math.random() < 0.15){
      createSect(c);
      c.memories.push('创建了自己的派系。');
      state.logs.push('【派系】'+c.name+'创建了自己的派系。');
    }
  });
}
function tickAllianceCheck(){
  Object.keys(state.relations).forEach(function(k){
    var r = state.relations[k];
    if(r.allies && r.score < 60){
      r.allies = false;
      var a = state.consorts.find(function(x){return x.id === r.a;});
      var b = state.consorts.find(function(x){return x.id === r.b;});
      if(a && a.alive) a.memories.push('与'+b.name+'的姐妹情谊破裂。');
      if(b && b.alive) b.memories.push('与'+a.name+'的姐妹情谊破裂。');
      state.logs.push('【后宫】'+(a?a.name:'')+'与'+(b?b.name:'')+'姐妹情谊破裂。');
    }
  });
}

function stirConflict(){
  var e=state.emperor;
  if(e.power<5){alert('势力不足');return;}
  var valid=state.factions.filter(function(f){return f.leader && f.leader.alive && f.members.length>0;});
  if(valid.length<2){alert('派系不足');return;}
  e.power-=5;
  var f1=pick(valid);
  var f2=pick(valid.filter(function(f){return f.id!==f1.id;}));
  if(!f1||!f2) return;
  f1.members.forEach(function(id){var c=state.consorts.find(function(x){return x.id===id;});if(c&&f2.members.length){var t=state.consorts.find(function(x){return x.id===f2.members[0];});if(t){var r=getRel(c.id,t.id);r.score=clamp(r.score-15,-100,100);}}});
  alert('【挑拨】\n\n你稍加挑拨，'+f1.name+'与'+f2.name+'的矛盾加深了。');
  updateFactionPower();
  render();
}
function stirInternalConflict(){
  var e=state.emperor;
  if(e.power<8){alert('势力不足');return;}
  var valid=state.factions.filter(function(f){return f.members.length>=2;});
  if(!valid.length){alert('没有合适派系');return;}
  e.power-=8;
  var f=pick(valid);
  var m1=pick(f.members);
  var m2=pick(f.members.filter(function(x){return x!==m1;}));
  var c1=state.consorts.find(function(x){return x.id===m1;});
  var c2=state.consorts.find(function(x){return x.id===m2;});
  if(!c1||!c2) return;
  var r=getRel(c1.id,c2.id);
  r.score=clamp(r.score-20,-100,100);
  alert('【挑拨】\n\n你稍加挑拨，'+c1.name+'与'+c2.name+'（同属'+f.name+'）互相猜忌。');
  render();
}

  closeModal();render();

  if(state._isRecruiting){
    c.memories=['由'+ (state._recruitSource==='minister'?'大臣':state._recruitSource==='weifu'?'偶遇':'宴席') +'入宫，得封'+RANKS[rankIdx]+'。'];

      state.emperor.charm = clamp(state.emperor.charm + Math.floor(bonus/3), 0, 100);

      state.emperor.power += Math.floor(bonus/4);

function showPalaceChoice(){
  if(!palaceQueue.length){
    updateFactionPower();initRelations();
    if(state._isRecruiting) state._isRecruiting=false;
    closeModal();render();
    return;
  }
  var c = palaceQueue[0];
  var tier = getRankTier(c.rankIdx);
  var tierName = tier==='main'?'主殿':tier==='side'?'侧殿':tier==='wing'?'偏殿':'掖庭';
  var html = '<h4>安排宫殿 · '+c.name+'</h4>';
  html += '<div style="font-size:12px;color:#9a8c78;margin-bottom:10px">位分：'+RANKS[c.rankIdx]+' · 需居'+tierName+'</div>';
  html += '<div style="font-size:11px;color:#9a8c78;margin-bottom:10px">剩余 '+palaceQueue.length+' 人待安排</div>';
  
  var allowMain = (tier==='main');
  var allowSide = (tier==='main'||tier==='side');
  var allowWing = (tier!=='yeiting');
  
  if(allowMain){
    PALACE_DEFS.forEach(function(p){
      if(p.id===0||p.id===10) return;
      if(p.main===0) return;
      var pal = state.palaces[p.id];

        html += '<button class="choice" onclick="placeConsort('+c.id+','+p.id+',\'main\')">'+p.name+' · 主殿</button>';
      }
    });
  }
  if(allowSide){
    PALACE_DEFS.forEach(function(p){
      if(p.id===0||p.id===10) return;
      if(p.side===0) return;
      var pal = state.palaces[p.id];
      if(pal.side.length<p.side){
        html += '<button class="choice" onclick="placeConsort('+c.id+','+p.id+',\'side\')">'+p.name+' · 侧殿 ('+pal.side.length+'/'+p.side+')</button>';
      }
    });
  }
  if(allowWing){
    PALACE_DEFS.forEach(function(p){
      if(p.id===0||p.id===10) return;
      if(p.wing===0) return;
      var pal = state.palaces[p.id];
      if(pal.wing.length<p.wing){
        html += '<button class="choice" onclick="placeConsort('+c.id+','+p.id+',\'wing\')">'+p.name+' · 偏殿 ('+pal.wing.length+'/'+p.wing+')</button>';
      }
    });
  }
  html += '<button class="choice" style="background:#2a1815" onclick="placeConsort('+c.id+',10,\'yeiting\')">掖庭（低位宫人聚居）</button>';
  html += '<button class="choice" style="background:#5a1a1a;border-color:#8a3a3a;text-align:center" onclick="cancelRecruit()">取消，不收入宫中</button>';
  replaceModal(html);
}
function placeConsort(id, pid, type){
  var c = state.consorts.find(function(x){return x.id===id;});
  if(!c) return;
  if(pid===10){
    state.palaces[10].wing.push(c.id);
    c.palaceId = 10;
    c.roomType = 'yeiting';
  } else if(type==='main'){
    state.palaces[pid].main = c.id;

    state.palaces[pid].side.push(c.id);

    state.palaces[pid].wing.push(c.id);

function moveConsorts(){
  state.consorts.filter(function(c){return c.alive && (c.groundedUntil||0)<=absXun() && !c.inColdPalace;}).forEach(function(c){
    if(Math.random()<0.4) c.location=pick(ALL_LOCATIONS);

function getPresentConsorts(loc){
  var alive=state.consorts.filter(function(c){return c.alive && (c.groundedUntil||0)<=absXun();});
  var present=[];
  alive.forEach(function(c){ if(c.location===loc) present.push({c:c,type:'resident'}); });
  var attract=LOCATION_ATTRACT[loc]||0.5;
  alive.forEach(function(c){
    if(c.location===loc) return;
    var chance=attract*0.15*(1+c.favor/200)*(1+state.emperor.charm/200);
    if(c.per==='活泼'||c.per==='娇纵'||c.per==='张扬') chance*=1.6;
    if(c.health<40) chance*=0.3;
    if(Math.random()<chance) present.push({c:c,type:'random'});
  });
  if(present.length>3) present=present.slice(0,3);
  return present;
}
function triggerSingleEncounter(item, loc){
  var c=item.c;

  var events=[];
  events.push({w:3,msg:prefix+c.name+'远远望见你，快步迎上。',
    apply:function(){c.favor=clamp(c.favor+3,0,100);state.emperor.mood=clamp(state.emperor.mood+2,0,100);return '好感+3，心情+2';}});
  events.push({w:4,msg:prefix+c.name+'在'+loc+'与你偶遇，恭敬行礼。',
    apply:function(){c.favor=clamp(c.favor+2,0,100);return '好感+2';}});
  if(Math.random()<0.4){
    var art=pick(['抚琴','起舞','吟诗','作画','唱曲','下棋']);
    events.push({w:2,msg:prefix+c.name+'在'+loc+'为你'+art+'，风采动人。',
      apply:function(){c.favor=clamp(c.favor+3,0,100);state.emperor.charm=clamp(state.emperor.charm+1,0,100);return '好感+3，魅力+1';}});
  }
  var totalW=events.reduce(function(s,e){return s+e.w;},0);
  var r=Math.random()*totalW,chosen=events[0];
  for(var i=0;i<events.length;i++){r-=events[i].w;if(r<=0){chosen=events[i];break;}}

function doLocationAction(loc, actName, msgText, changes){
  var summary=applyEmperorChanges(changes);
  var evMsg=triggerLocationRandomEvent(loc);
  var present=state.currentPresent||[];
  var encText='';
  var rivalData=null;
  if(present.length===1){
    var r=triggerSingleEncounter(present[0],loc);
    if(r){encText='\n'+r.msg+'\n'+r.result;state.logs.push('【'+loc+'】'+r.msg);}
  } else if(present.length>=2){
    var shuffled=present.slice().sort(function(){return Math.random()-0.5;});
    rivalData={c1:shuffled[0].c,c2:shuffled[1].c,loc:loc};
  }
  var full='【'+loc+' · '+actName+'】\n'+msgText;
  if(summary) full+='\n数值变化：'+summary;
  if(evMsg) full+='\n'+evMsg;
  if(encText) full+=encText;
  if(rivalData) full+='\n\n【争风吃醋】'+rivalData.c1.name+'与'+rivalData.c2.name+'竟然同时在此！';
  state.logs.push('【'+loc+'】'+actName+' '+(summary||''));
  if(rivalData){closeModal();showRivalChoice(rivalData.c1,rivalData.c2,loc,full);}
  else{alert(full);closeModal();render();}
  state.currentPresent=[];
}

function showRelations(cid){ 
  var c=state.consorts.find(function(x){return x.id===cid;});
  if(!c) return;
  var others = state.consorts.filter(function(x){return x.alive&&x.id!==cid;});
  if(!others.length){
    replaceModal('<h4>'+c.name+' · 后宫关系</h4><div style="color:#9a8c78;padding:10px">后宫只有她一人。</div><div style="margin-top:15px;text-align:right"><button onclick="showDetail('+cid+')">返回</button><button onclick="closeModal()">关闭</button></div>');
    return;
  }
  // 按分数排序，最亲密在前
  var items = others.map(function(o){
    var r=getRel(cid,o.id);
    return {c:o, score:r.score};
  }).sort(function(a,b){return b.score-a.score;});
  // 分组
  var groups = [
    {name:'亲密',  color:'#8ac9a0', min:60,  max:100},
    {name:'友善',  color:'#a8d8b0', min:30,  max:59},
    {name:'平常',  color:'#c9b48a', min:-10, max:29},
    {name:'不和',  color:'#c98a4a', min:-40, max:-11},
    {name:'敌对',  color:'#c94a5a', min:-100,max:-41}
  ];
  var html='<h4>'+c.name+' · 后宫关系网</h4>';
  html+='<div style="font-size:11px;color:#9a8c78;margin-bottom:8px">共 '+others.length+' 人 · 关系值范围 -100 ~ 100</div>';
  groups.forEach(function(g){
    var list = items.filter(function(it){return it.score>=g.min && it.score<=g.max;});
    if(!list.length) return;
    html+='<div class="section-head" style="color:'+g.color+'">'+g.name+'（'+list.length+'人）</div>';
    list.forEach(function(it){
      var w = Math.round((it.score+100)/2);
      html+='<div style="font-size:12px;padding:5px 0;border-bottom:1px solid #2a2018">';
      html+='<div style="display:flex;justify-content:space-between"><span>'+it.c.name+'（'+RANKS[it.c.rankIdx]+'）</span><span style="color:'+g.color+'">'+it.score+'</span></div>';
      html+='<div class="meter" style="height:5px;margin-top:3px"><i style="width:'+w+'%;background:'+g.color+'"></i></div>';
      html+='</div>';
    });
  });
  html+='<div class="section-head">操作</div>';
  html+='<button class="choice" onclick="showAllRelations()">查看全后宫关系总览（谁和谁最差）</button>';
  html+='<div style="margin-top:15px;text-align:right"><button onclick="showDetail('+cid+')">返回</button><button onclick="closeModal()">关闭</button></div>';
  replaceModal(html);
}

function showAllRelations(){
  var alive = state.consorts.filter(function(c){return c.alive && !c.inColdPalace;});
  if(alive.length < 2){
    alert('后宫不足两人。');
    return;
  }
  var pairs = [];
  for(var i=0;i<alive.length;i++){
    for(var j=i+1;j<alive.length;j++){
      var r = getRel(alive[i].id, alive[j].id);
      pairs.push({a:alive[i], b:alive[j], score:r.score});
    }
  }
  // 按关系值排序，最差的在前
  pairs.sort(function(x,y){return x.score - y.score;});
  var html='<h4>后宫关系总览</h4>';
  html+='<div style="font-size:11px;color:#9a8c78;margin-bottom:8px">共 '+pairs.length+' 对关系 · 最差在前</div>';
  html+='<div style="max-height:400px;overflow-y:auto">';
  pairs.forEach(function(p){
    var g,color;
    if(p.score>=60){g='亲密';color='#8ac9a0';}
    else if(p.score>=30){g='友善';color='#a8d8b0';}
    else if(p.score>=-10){g='平常';color='#c9b48a';}
    else if(p.score>=-40){g='不和';color='#c98a4a';}
    else {g='敌对';color='#c94a5a';}
    var w = Math.round((p.score+100)/2);
    html+='<div style="font-size:12px;padding:5px 0;border-bottom:1px solid #2a2018">';
    html+='<div style="display:flex;justify-content:space-between"><span>'+p.a.name+' ↔ '+p.b.name+'</span><span style="color:'+color+'">'+g+' ('+p.score+')</span></div>';
    html+='<div class="meter" style="height:5px;margin-top:3px"><i style="width:'+w+'%;background:'+color+'"></i></div>';
    html+='</div>';
  });
  html+='</div>';
  html+='<div style="margin-top:15px;text-align:right"><button onclick="closeModal()">关闭</button></div>';
  replaceModal(html);
}
function doConsortAction(id, idx){
  var c=state.consorts.find(function(x){return x.id===id;});
  if(!c) return;
  var action=CONSORT_ACTIONS[idx];
  if(!action) return;
  var msg=action.f(c);
  state.logs.push(msg);
  updateFactionPower();
  showDetail(id);
  var tip=document.getElementById('actionTip');
  if(!tip){tip=document.createElement('div');tip.id='actionTip';tip.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(30,20,12,.95);border:1px solid #c9a227;color:#e8c96a;padding:10px 20px;border-radius:6px;font-size:13px;z-index:200';document.body.appendChild(tip);}
  tip.textContent=msg;
  tip.style.opacity='1';
  setTimeout(function(){tip.style.transition='opacity .4s';tip.style.opacity='0';},1800);
}

function openModal(html){
  var modal = document.getElementById('modal');
  if(modal.classList.contains('on') && modal.innerHTML.trim() === ''){
    modal.innerHTML = html;
    return;
  }
  if(modal.classList.contains('on')){
    state._modalQueue = state._modalQueue || [];
    state._modalQueue.push(html);
    return;
  }
  modal.innerHTML = html;
  modal.classList.add('on');
}
// 强制替换当前弹窗，不排队（用于主动点击触发的界面切换）
function replaceModal(html){
  var modal = document.getElementById('modal');
  modal.innerHTML = html;
  modal.classList.add('on');
}
function closeModal(){
  var modal = document.getElementById('modal');
  if(!modal.classList.contains('on')) return;
  modal.classList.remove('on');
  if(state._modalQueue && state._modalQueue.length){
    var next = state._modalQueue.shift();
    setTimeout(function(){
      document.getElementById('modal').innerHTML = next;
      document.getElementById('modal').classList.add('on');
    }, 80);
  }
}

  state.pendingColdInvestigation=null;

  if(!c||!c.alive||!c.inColdPalace) return;
  var html='<h4>🔍 冷宫调查结果</h4>';
  var msg='';
  if(inv.fromEmperor){
    // 可能是皇上的骨肉
    var isEmperor = Math.random()<0.7; // 七成概率是皇上的
    if(isEmperor){
      msg='查实：'+c.name+'所怀之胎确为皇上骨肉。冷宫守卫供认，数月前皇上曾亲至冷宫。';

    }
    state._coldInvResult={cid:c.id,exposed:exposed,fromEmperor:false};

function resolveColdInvestigation(action){
  var r=state._coldInvResult;
  if(!r){closeModal();return;}
  var c=state.consorts.find(function(x){return x.id===r.cid;});
  if(!c){state._coldInvResult=null;closeModal();return;}
  var msg='';
  if(action==='acceptEmperor'){
    // 是皇上骨肉，接出冷宫
    c.inColdPalace=false;c.mood='欢喜';c.power=ri(3,8);c.favor=clamp(c.favor+15,0,100);
    c.memories.push('查出所怀为皇上骨肉，被接出冷宫。');
    state.logs.push('【冷宫】'+c.name+'查出怀有皇嗣，被接出冷宫。');
    msg='你下令将'+c.name+'接出冷宫，封为低位。她重获自由，泣不成声。';
  } else if(action==='keepCold'){
    c.memories.push('查出所怀为皇上骨肉，但暂留冷宫待产。');
    msg='你下令暂留冷宫待产，待产后再议。'+c.name+'神色复杂。';
  } else if(action==='strict' && r.exposed){
    if(r.fromEmperor && !r.isEmperor){
      // 谎称皇嗣，重罚
      c.health=clamp(c.health-ri(20,40),0,100);
      c.mood='怨恨';
      c.pregnant=false;c.truePregnant=false;
      c.memories.push('谎称皇嗣事发，被打入更深冷宫。');
      msg='你下令将'+c.name+'杖五十，打入更深冷宫，终身不得出，胎儿不保。';
    } else {
      // 私通
      c.health=clamp(c.health-ri(20,40),0,100);
      c.pregnant=false;c.truePregnant=false;
      c.mood='怨恨';
      c.memories.push('私通怀孕事发，被打入更深冷宫。');
      msg='你下令将'+c.name+'杖五十，打入更深冷宫，终身不得出，胎儿不保。';
    }
  } else if(action==='lenient' && r.exposed){
    c.power=clamp(c.power-5,0,100);
    c.health=clamp(c.health-ri(10,20),0,100);
    c.pregnant=false;c.truePregnant=false;
    c.mood='幽怨';
    c.memories.push('怀孕之事被从轻发落。');
    msg='你从轻发落，'+c.name+'受了薄惩，胎儿不保。';
  } else {
    msg='查无实据，此事不了了之。';
  }
  state.logs.push('【冷宫】'+msg);
  alert(msg);
  state._coldInvResult=null;

function doColdSleep(id){
  if(state.ap<1){alert('行动点不足');return;}
  var c=state.consorts.find(function(x){return x.id===id;});
  if(!c||!c.inColdPalace) return;
  if(c.pregnant||c.truePregnant){alert('她已有身孕。');return;}
  if(c.health<30){alert('她身体虚弱，不宜侍寝。');return;}
  state.ap--;
  c.favor=clamp(c.favor+ri(5,12),0,100);
  c.mood='爱慕';
  c.lastVisit=absXun();
  c.lastColdSleepXun=absXun();
  var desc=pick([
    '冷宫的床榻简陋，'+c.name+'却红着眼眶迎了上来。',
    '你走进冷宫，'+c.name+'怔了很久，才颤抖着跪下。',
    '烛火摇曳，'+c.name+'紧紧攥着你的衣袖不肯放。',
    '冷宫寒风刺骨，'+c.name+'却觉得这一夜比春日还暖。',
    '她不敢相信你会来，直到你伸手拭去她脸上的泪。'
  ]);
  c.memories.push('冷宫中得皇上宠幸。');
  state.logs.push('【冷宫】皇上宠幸了'+c.name+'。');
  // 怀孕判定
  var ageF=c.age<18?0.4:c.age<26?1.0:c.age<36?0.5:0.1;
  var healthF=c.health/100;
  var gain=Math.round(20*ageF*healthF);
  c.fertility=(c.fertility||0)+gain;
  var pregFlag=false;
  if(c.fertility>=ri(70,100)){
    c.truePregnant=true;c.pregnancyStart=absXun();c.pregnancyKnown=false;c.pregnancySymptoms=false;c.lastPulse=absXun();c.fertility=0;
    pregFlag=true;
    c.hasBeenPregnant=true;
  }
  alert(desc+'\n\n好感+，'+(pregFlag?'（或许会有喜讯）':''));
  showColdPalaceDetail(id);render();
}

function doColdAction(id,type){
  var c=state.consorts.find(function(x){return x.id===id;});
  if(!c||!c.inColdPalace) return;
  c.memories=c.memories||[];
  var msg='';
  if(type==='visit'){
    if(state.ap<1){alert('行动点不足');return;}
    state.ap--;
    var g=ri(5,10);
    c.favor=clamp(c.favor+g,0,100);
    c.mood='欢喜';
    c.lastVisit=absXun();
    var act=pick([
      '你亲自去了冷宫。'+c.name+'跪在院中，见到你时眼眶一下子红了。',
      '冷宫的门咯吱一声打开，'+c.name+'怔怔看了你好一会儿才跪下行礼。',
      '你站在院中，'+c.name+'低着头，只说了句「皇上万安」，声音却哽咽。'
    ]);
    c.memories.push('皇上亲至冷宫探望。');
    msg=act+'\n好感+'+g;
  } else if(type==='gift'){
    if(state.emperor.gold<200){alert('国库不足200两');return;}
    state.emperor.gold-=200;
    var g2=ri(3,6);
    c.favor=clamp(c.favor+g2,0,100);
    c.mood='平静';
    var act2=pick([
      '你命人送去冬衣与炭火，'+c.name+'默默收了。',
      '你让人送了食盒过去，'+c.name+'捧着碗，坐了很久没动筷。',
      '几匹粗布、一床旧被送到了冷宫。'
    ]);
    c.memories.push('皇上遣人送来衣食。');
    msg=act2+'\n好感+'+g2+'，国库-200';
  } else if(type==='scoff'){
    var g3=ri(5,10);
    c.favor=clamp(c.favor-g3,0,100);
    c.power=clamp(c.power-2,0,100);
    c.mood='怨恨';
    var act3=pick([
      '你隔着院墙冷冷道：「好好思过。」'+c.name+'身子一颤。',
      '你讥讽了几句，'+c.name+'脸色煞白，咬着唇没说话。',
      '你瞥了她一眼，转身离去。'+c.name+'跪了很久。'
    ]);
    c.memories.push('皇上冷言相讥。');
    msg=act3+'\n好感-'+g3+'，势力-2';
  } else if(type==='copy'){
    var s=ri(1,3);
    c.power=clamp(c.power-s,0,100);
    c.mood='忧愁';
    c.memories.push('奉命抄经，心中郁结。');
    msg='你命她每日抄经百卷。势力-'+s;
  }
  state.logs.push('【冷宫】'+msg);
  alert(msg);
  showColdPalaceDetail(id);
  render();
}

function childAction(id,action){
  var ch=state.children.find(function(c){return c.id===id;});if(!ch)return;
  var e=state.emperor;
  if(action==='crown'){
    if(e.power<50){alert('势力不足50');return;}
    if(!(ch.gender==='男'&&ch.literary>=200&&ch.martial>=200&&ch.power>=200)){alert('标准不满足：需皇子，文才/武艺/势力均≥200');return;}
    state.crownPrince=ch.id;
    state.logs.push('【册封】'+ch.name+'被册立为太子。');
    alert('册立'+ch.name+'为太子！');
    showChildDetail(id);render();return;
  }
  if(action==='dismiss'){
    if(e.power<50){alert('势力不足50');return;}
    e.power-=50;
    ch.favor=clamp(ch.favor-20,0,100);
    ch.ambition=clamp(ch.ambition+30,0,100);
    state.crownPrince=null;
    state.children.filter(function(x){return x.alive&&x.gender==='男'&&x.id!==ch.id&&x.ambition>50;}).forEach(function(x){
      x.ambition=clamp(x.ambition+ri(5,15),0,100);
    });
    state.logs.push('【废太子】'+ch.name+'被废。');
    alert('废黜太子。'+ch.name+'好感-20，野心+30。');
    showChildDetail(id);render();return;
  }

  if(state.ap<1){alert('行动点不足');return;}
  state.ap--;
  var msg='';
  if(action==='visit'){var h=ri(1,5);ch.health+=h;ch.power+=2;msg='你去看望'+ch.name+'。体质+'+h+'，势力+2';}
  else if(action==='tease'){var f=ri(1,5);ch.favor=clamp(ch.favor+f,0,100);ch.power+=1;msg='你逗弄'+ch.name+'，他/她咯咯笑。好感+'+f+'，势力+1';}
  else if(action==='enlighten'){var i=ri(1,5);ch.intel+=i;ch.power+=2;msg='你为'+ch.name+'启蒙。智力+'+i+'，势力+2';}
  else if(action==='outing'){var h2=ri(1,5);ch.health+=h2;ch.power+=2;msg='你带'+ch.name+'出去玩。体质+'+h2+'，势力+2';}
  else if(action==='literary'){var l=ri(1,5);ch.literary+=l;msg='你教'+ch.name+'读书。文才+'+l;}
  else if(action==='martial'){var m=ri(1,5);ch.martial+=m;msg='你教'+ch.name+'习武。武艺+'+m;}
  else if(action==='power'){var p=ri(1,5);ch.power+=p;msg='你为'+ch.name+'造势。势力+'+p;}
  else {state.ap++;return;}
  ch.memories=ch.memories||[];
  ch.memories.push(msg);
  state.logs.push(msg);
  alert(msg);
  showChildDetail(id);render();
}

function arrangeMarriage(childId){
  var ch=state.children.find(function(c){return c.id===childId;});
  if(!ch||ch.gender!=='男'||!ch.alive) return;
  if((state.year-ch.birthYear)<16){alert('皇子尚未成年');return;}
  if(ch.married){alert('已经娶亲');return;}
  var isCrown = state.crownPrince === childId;
  var cost = isCrown ? 1000 : 500;
  if(state.emperor.gold < cost){alert('国库不足'+cost+'两');return;}
  // 三种场景各有20%概率出现
  var hasMother = state.consorts.some(function(c){return c.id===ch.motherId && c.alive;});
  var r = Math.random();
  var scene;
  if(r < 0.20) scene = 'courtier';
  else if(r < 0.40) scene = 'request';
  else if(r < 0.60 && hasMother) scene = 'mother';
  else scene = 'courtier';
  startPrinceMarriageScene(childId, scene);
}

function startPrinceMarriageScene(princeId, scene){
  var prince = state.children.find(function(c){return c.id===princeId;});
  if(!prince) return;
  var isCrown = state.crownPrince === princeId;
  var cost = isCrown ? 1000 : 500;
  var rankName = isCrown ? '太子妃' : '王妃';
  var candidate = generatePrinceConsort(scene, isCrown);
  state._pendingPrinceMarriage = {princeId:princeId, scene:scene, candidate:candidate, cost:cost, rankName:rankName};
  var html = '<h4>👑 赐婚 · ' + rankName + '</h4>';
  var text='';
  if(scene==='courtier'){
    var minister = pick(['礼部尚书','大学士','兵部尚书','侍郎','太傅','翰林学士','内阁首辅','吏部尚书','工部尚书']);
    text = minister+'求见，躬身道：\n\n"臣有一女，名唤'+candidate.name+'，年方'+candidate.age+'，愿许配'+(isCrown?'太子':'皇子'+prince.name)+'。"\n\n此女家世'+candidate.fam+'，性情'+candidate.per+'。';
  } else if(scene==='request'){
    text = (isCrown?'太子':'皇子'+prince.name)+'求见，恳请父皇赐婚。\n\n他看中了一位女子，名唤'+candidate.name+'，年方'+candidate.age+'，家世'+candidate.fam+'，性情'+candidate.per+'。\n此女对殿下颇有好感。';
  } else {
    var mother = state.consorts.find(function(c){return c.id===prince.motherId;});
    text = (mother?mother.name:'生母')+'求见，道：\n\n"臣妾想将娘家族中的侄女'+candidate.name+'许配'+(isCrown?'太子':'皇子'+prince.name)+'。\n此女年方'+candidate.age+'，家世'+candidate.fam+'，性情'+candidate.per+'。"';
  }
  html += '<div style="white-space:pre-line;color:#c9b48a;font-size:13px;line-height:1.8;margin-bottom:12px;border-left:3px solid #c9a227;padding-left:10px">'+text+'</div>';
  html += '<div style="font-size:12px;color:#9a8c78;margin-bottom:12px">姓名：'+candidate.name+' · '+candidate.age+'岁 · '+candidate.per+' · '+candidate.fam+'<br>';
  html += '魅力：'+candidate.charm+' · 智力：'+candidate.intel+' · 体质：'+candidate.health+'<br>';
  html += '对殿下好感：'+candidate.favor+'</div>';
  if(scene==='courtier'){
    html += '<button class="choice" onclick="resolvePrinceMarriage(1)">允婚（耗国库'+cost+'两，势力+5~10）</button>';
    html += '<button class="choice" onclick="resolvePrinceMarriage(0)">婉拒</button>';
  } else if(scene==='request'){
    html += '<button class="choice" onclick="resolvePrinceMarriage(1)">应允（耗国库'+cost+'两，势力-5~10）</button>';
    html += '<button class="choice" onclick="resolvePrinceMarriage(0)">不准（殿下对父皇好感-5~10）</button>';
  } else {
    html += '<button class="choice" onclick="resolvePrinceMarriage(1)">允婚（势力+5，生母势力+5，好感+5）</button>';
    html += '<button class="choice" onclick="resolvePrinceMarriage(0)">婉拒（生母势力-5，好感-5）</button>';
  }
  replaceModal(html);
}

function generatePrinceConsort(scene, isCrown){
  var scale = isCrown ? 1.0 : 0.9;
  var c = genConsort(0, false);
  c.alive = true;
  c.children = [];
  c.memories = [];
  c.isPrinceWife = true;
  c.rankIdx = 0;
  if(scene==='courtier'){
    c.age = ri(14,16);
    c.charm = Math.round(ri(60,100)*scale);
    c.intel = Math.round(ri(70,100)*scale);
    c.health = Math.round(ri(40,70)*scale);
    c.favor = ri(20,60);
  } else if(scene==='request'){
    c.age = ri(14,20);
    c.charm = Math.round(ri(80,100)*scale);
    c.intel = Math.round(ri(40,80)*scale);
    c.health = Math.round(ri(60,90)*scale);
    c.favor = ri(60,100);
  } else {
    c.age = ri(14,18);
    c.charm = Math.round(ri(50,80)*scale);
    c.intel = Math.round(ri(50,80)*scale);
    c.health = Math.round(ri(50,80)*scale);
    c.favor = ri(40,70);
  }
  return c;
}

function resolvePrinceMarriage(accept){
  var data = state._pendingPrinceMarriage;
  state._pendingPrinceMarriage = null;
  if(!data){ closeModal(); return; }
  var prince = state.children.find(function(c){return c.id===data.princeId;});
  if(!prince){ closeModal(); return; }
  var candidate = data.candidate;
  var isCrown = state.crownPrince === prince.id;
  var rankName = data.rankName;
  var scene = data.scene;
  if(accept){
    if(state.emperor.gold < data.cost){ alert('国库不足'+data.cost+'两'); return; }
    state.emperor.gold -= data.cost;
    candidate.memories.push('嫁与'+prince.name+'为'+rankName+'。');
    if(!prince.consorts) prince.consorts = [];
    prince.consorts.push(candidate);
    prince.married = true;
    prince.spouse = candidate.name;
    prince.spouseFam = candidate.fam;
    if(scene==='courtier'){
      var gain = ri(5,10);
      prince.power = Math.max(0, prince.power+gain); // 核心修复：解除100上限
      prince.memories.push('与'+candidate.name+'成婚，势力+'+gain+'。');
      state.logs.push('【赐婚】'+prince.name+'与'+candidate.name+'成婚，势力+'+gain+'。');
    } else if(scene==='request'){
      var loss = ri(5,10);
      prince.power = Math.max(0,prince.power-loss);
      prince.memories.push('父皇赐婚'+candidate.name+'，势力-'+loss+'。');
      state.logs.push('【赐婚】'+prince.name+'娶'+candidate.name+'，势力-'+loss+'。');
    } else {
      prince.power = clamp(prince.power+5,0,100);
      var mother = state.consorts.find(function(c){return c.id===prince.motherId;});
      if(mother && mother.alive){
        mother.power = clamp(mother.power+5,0,100);
        mother.favor = clamp(mother.favor+5,0,100);
      }
      prince.memories.push('娶生母推荐的'+candidate.name+'，势力+5。');
      state.logs.push('【赐婚】'+prince.name+'娶生母族女'+candidate.name+'。');
    }
    alert('允婚！'+prince.name+'迎娶'+candidate.name+'为'+rankName+'。');
    if(Math.random()<0.30) triggerAmnesty('皇子大婚');
  } else {
    if(scene==='request'){
      var loss2 = ri(5,10);
      prince.favor = Math.max(0,prince.favor-loss2);
      state.logs.push('【赐婚】'+prince.name+'求赐婚被拒，对父皇好感-'+loss2+'。');
      alert('你拒绝了赐婚。'+prince.name+'神色黯淡，对父皇好感-'+loss2+'。');
    } else if(scene==='mother'){
      var mother2 = state.consorts.find(function(c){return c.id===prince.motherId;});
      if(mother2 && mother2.alive){
        mother2.power = Math.max(0,mother2.power-5);
        mother2.favor = Math.max(0,mother2.favor-5);
      }
      state.logs.push('【赐婚】你拒绝生母推荐，生母不悦。');
      alert('你婉拒了。生母不悦，势力-5，好感-5。');
    } else {
      state.logs.push('【赐婚】你婉拒了朝臣联姻。');
      alert('你婉拒了。朝臣退下。');
    }
  }
  closeModal(); render();
}

// 成年皇子拉拢朝臣
function adultChildrenAmbition(){
  state.children.filter(function(c){return c.alive && c.gender==='男' && (state.year-c.birthYear)>=16;}).forEach(function(ch){
    // 每年最多拉拢一次，每次加 1~5 势力
    var gain = Math.max(0, Math.round((ch.intel + ch.character + ch.favor)/60) + ri(-1,2));
    if(gain<=0) return;
    ch.power = Math.max(0, ch.power + gain); // 核心修复：解除100上限
    ch.memories = ch.memories || [];
    ch.memories.push('与朝中几位大臣往来，势力+'+gain+'。');
    state.logs.push('【朝堂】'+ch.name+'暗中拉拢朝臣，势力+'+gain+'。');
    // 势力超过 150 后野心才有概率增长（此时候爵位已近亲王，逼近太子之位）
    if(ch.power > 150 && Math.random() < 0.3){
      ch.ambition = clamp(ch.ambition + ri(3,8), 0, 100);
      ch.memories.push('势力渐大，已至'+ch.power+'，心中另有所图……');
    }
    // 夺嫡暗流：立太子后其他皇子野心增长，势力逼近太子时开始谋划
    if(state.crownPrince && ch.id !== state.crownPrince){
      ch.ambition = clamp(ch.ambition + ri(1,3), 0, 100);
      var crown = state.children.find(function(c){return c.id===state.crownPrince;});
      if(crown && crown.alive && ch.power > crown.power*0.8){
        ch.schemes = (ch.schemes||0) + 1;
      }
    }
  });
}

// 成年皇子府中生儿育女
function tickAdultChildrenFamily(){
  if(state.day!==1) return; // 核心修复：day 到 1 时正好是跨年，不是 36
  state.children.filter(function(c){return c.alive && c.gender==='男' && (state.year-c.birthYear)>=16;}).forEach(function(prince){
    if(!prince.consorts || !prince.consorts.length) return;
    if(!prince.married) return;
    prince.consorts.forEach(function(wife){
      if(!wife.alive) return;
      if(Math.random()<0.15){
        var r = Math.random();
        var count = r<0.70 ? 1 : r<0.90 ? 2 : 3;
        var genderArr = [];
        for(var i=0;i<count;i++){ genderArr.push(Math.random()<0.5?'男':'女'); }
        var babyNames = [];
        genderArr.forEach(function(gender){
          var baby = genChild(wife, gender);
          baby.fatherId = prince.id;
          baby.birthYear = state.year;
          baby.birthDay = state.day;
          baby.name = state.emperor.surname + (gender==='男'?pick(CHILD_NAMES_M):pick(CHILD_NAMES_F));
          baby.named = true;
          state.children.push(baby);
          prince.children = prince.children || [];
          prince.children.push(baby.id);
          wife.children.push(baby.id);
          babyNames.push(baby.name);
        });
        prince.memories = prince.memories || [];
        prince.memories.push('得'+count+'位子嗣：'+babyNames.join('、')+'。');
        state.logs.push('【皇孙】'+prince.name+'府上喜得'+count+'位子嗣。');
      }
    });
  });
}

function addHistory(event){
  if(!state.history) state.history = [];
  state.history.push({year: state.year, event: event});
  if(state.history.length > 200) state.history = state.history.slice(-200);
}

function showHistory(){
  var html='<h4>📜 国史馆 · 大事记</h4>';
  if(!state.history || !state.history.length){
    html+='<div style="color:#9a8c78;padding:10px">暂无大事记录。</div>';
  } else {
    // 按年份分组
    var byYear = {};
    state.history.forEach(function(h){
      if(!byYear[h.year]) byYear[h.year] = [];
      byYear[h.year].push(h.event);
    });
    var years = Object.keys(byYear).map(Number).sort(function(a,b){return b-a;});
    html+='<div style="max-height:400px;overflow-y:auto;font-size:13px;color:#c9b48a;line-height:1.8">';
    years.forEach(function(y){
      html+='<div style="color:#e8c96a;font-size:14px;margin:8px 0 4px;border-bottom:1px dashed #4a3a28;padding-bottom:3px">第'+y+'年</div>';
      byYear[y].forEach(function(e){
        html+='<div style="padding:3px 0 3px 12px;border-bottom:1px solid #2a2018">· '+e+'</div>';
      });
    });
    html+='</div>';
  }
  html+='<div style="margin-top:15px;text-align:right"><button onclick="closeModal()">关闭</button></div>';
  replaceModal(html);
}

// ==================== 日志 ====================
function showLog(){
  openModal('<h4>起居注</h4><div style="max-height:300px;overflow-y:auto">'+state.logs.slice().reverse().map(function(l){return '<div class="log">· '+l+'</div>';}).join('')+'</div><div style="margin-top:15px;text-align:right"><button onclick="closeModal()">关闭</button></div>');
}
function getSaveSlots(){var slots=[];for(var i=1;i<=5;i++){slots.push({id:i,data:localStorage.getItem('harem_slot_'+i)});}return slots;}
function showSave(){var html='<h4>存档</h4>';getSaveSlots().forEach(function(s){html+='<button class="choice" onclick="doSave('+s.id+')">档位 '+s.id+' '+(s.data?'（已有存档）':'（空）')+'</button>';});html+='<div style="margin-top:15px;text-align:right"><button onclick="closeModal()">关闭</button></div>';openModal(html);}
function doSave(slot){localStorage.setItem('harem_slot_'+slot,JSON.stringify(state));closeModal();replaceModal('<h4>存档</h4><div style="text-align:center;padding:20px;color:#e8c96a">已存入档位 '+slot+'！</div><div style="text-align:center;margin-top:10px"><button onclick="showSave()">返回存档列表</button><button onclick="closeModal()">关闭</button></div>');}
function showLoad(){var html='<h4>读档</h4>';getSaveSlots().forEach(function(s){html+='<button class="choice" '+(s.data?'onclick="doLoad('+s.id+')"':'disabled')+'>档位 '+s.id+' '+(s.data?'（已有存档）':'（空）')+'</button>';});html+='<div style="margin-top:15px;text-align:right"><button onclick="closeModal()">关闭</button></div>';openModal(html);}
function doLoad(slot){
  var s=localStorage.getItem('harem_slot_'+slot);
  if(!s){alert('档位为空');return;}
  state=JSON.parse(s);
  if(!state.version) state.version = 1; // 核心修复：老存档补版本号
  if(!state.relations)initRelations();
  if(!state.taihou)initTaihou();
  if(!state.achievements)state.achievements=[];
  if(!state.courtFactions)state.courtFactions={civil:50,military:50};
  if(state.pendingCrime===undefined)state.pendingCrime=null;
  closeModal();render();
  replaceModal('<h4>读档</h4><div style="text-align:center;padding:20px;color:#e8c96a">已读取档位 '+slot+'！</div><div style="text-align:center;margin-top:10px"><button onclick="closeModal()">关闭</button></div>');
  setTimeout(function(){
    if(getFestival() && !state.activeChain && !state._pendingSimpleEvent && !state._pendingConsortEvent){
      closeModal();
      setTimeout(showFestivalEvent, 200);
    }
  }, 1200);
}
function saveGame(){showSave();}
function loadGame(){showLoad();}

function checkAchievements(){
  if(!state.achievements) state.achievements=[];
  ACHIEVEMENTS.forEach(function(a){
    if(state.achievements.indexOf(a.id)<0 && a.check()){
      state.achievements.push(a.id);
      state.logs.push('【成就】'+a.name+'——'+a.desc);
    }
  });
}

function triggerConsortRequest(){
  if(Math.random()>0.35) return false;
  var alive=state.consorts.filter(function(c){return c.alive&&!c.inColdPalace;});
  if(!alive.length) return false;  
  var c=pick(alive);
  var t=Math.random();
  var html='<h4>💌 '+c.name+' 的请求</h4>';
  if(t<0.25){
    html+='<div style="color:#c9b48a;font-size:13px;margin-bottom:10px">'+c.name+'托人带话：皇上很久没来了，臣妾想见您。</div>';
    html+='<button class="choice" onclick="resolveConsortRequest('+c.id+',\'visit_yes\')">去见她（好感+8）</button>';
    html+='<button class="choice" onclick="resolveConsortRequest('+c.id+',\'visit_no\')">拒绝（好感-5）</button>';
  } else if(t<0.4){
    if(c.rankIdx<=0) return false;
    html+='<div style="color:#c9b48a;font-size:13px;margin-bottom:10px">'+c.name+'婉转表达，希望能晋位分。</div>';
    html+='<button class="choice" onclick="resolveConsortRequest('+c.id+',\'promote_yes\')">为她晋位（势力-20）</button>';
    html+='<button class="choice" onclick="resolveConsortRequest('+c.id+',\'promote_no\')">暂不晋位（好感-3）</button>';
  } else if(t<0.55){
    html+='<div style="color:#c9b48a;font-size:13px;margin-bottom:10px">'+c.name+'看中了一枚玉簪，想要皇上赏赐。</div>';
    html+='<button class="choice" onclick="resolveConsortRequest('+c.id+',\'gift_yes\')">赏赐（500两，好感+6）</button>';
    html+='<button class="choice" onclick="resolveConsortRequest('+c.id+',\'gift_no\')">拒绝（好感-4）</button>';
  } else if(t<0.7){
    html+='<div style="color:#c9b48a;font-size:13px;margin-bottom:10px">'+c.name+'思念家人，请求允许家人入宫探望。</div>';
    html+='<button class="choice" onclick="resolveConsortRequest('+c.id+',\'family_yes\')">允许（好感+7）</button>';
    html+='<button class="choice" onclick="resolveConsortRequest('+c.id+',\'family_no\')">不许（好感-5）</button>';
  } else if(t<0.85){
    var hc=state.children.filter(function(x){return x.alive&&x.motherId===c.id;});
    if(!hc.length) return false;
    var ch=pick(hc);
    html+='<div style="color:#c9b48a;font-size:13px;margin-bottom:10px">'+c.name+'说'+ch.name+'思念父皇，想请皇上去看看孩子。</div>';
    html+='<button class="choice" onclick="resolveConsortRequest('+c.id+',\'child_yes\')">去看孩子（好感+5）</button>';
    html+='<button class="choice" onclick="resolveConsortRequest('+c.id+',\'child_no\')">拒绝（好感-4）</button>';
  } else {
    html+='<div style="color:#c9b48a;font-size:13px;margin-bottom:10px">'+c.name+'家中兄弟犯了小错，求皇上从轻发落。</div>';
    html+='<button class="choice" onclick="resolveConsortRequest('+c.id+',\'help_yes\')">从轻发落（好感+8，势力-2）</button>';
    html+='<button class="choice" onclick="resolveConsortRequest('+c.id+',\'help_no\')">按律处置（好感-6，势力+2）</button>';
  }
  openModal(html);
  return true;
}
function resolveConsortRequest(id,action){
  var c=state.consorts.find(function(x){return x.id===id;});
  if(!c) return;
  var e=state.emperor,msg='';
  if(action==='visit_yes'){c.favor=clamp(c.favor+8,0,100);c.mood='欢喜';c.lastVisit=absXun();msg='你去看望了'+c.name+'。好感+8';}
  else if(action==='visit_no'){c.favor=clamp(c.favor-5,0,100);c.mood='幽怨';c.punished=true;msg='你拒绝了'+c.name+'。好感-5';}
else if(action==='promote_yes'){if(e.power<20){alert('势力不足');return;}if(c.rankIdx<=0){alert('已是皇后');return;}if(!canPromoteTo(c,c.rankIdx-1)){alert(rankFullMsg(c.rankIdx-1)+'，无法晋位。');return;}e.power-=20;c.rankIdx--;c.favor=clamp(c.favor+5,0,100);c.mood='得意';assignPalaces();updateFactionPower();msg='你晋升'+c.name+'为'+RANKS[c.rankIdx]+'。好感+5';} 
 else if(action==='promote_no'){c.favor=clamp(c.favor-3,0,100);c.mood='失落';msg='你暂未晋位'+c.name+'。好感-3';}
  else if(action==='gift_yes'){if(e.gold<500){alert('国库不足');return;}e.gold-=500;c.favor=clamp(c.favor+6,0,100);c.mood='欢喜';msg='你赏赐'+c.name+'玉簪。好感+6';}
  else if(action==='gift_no'){c.favor=clamp(c.favor-4,0,100);c.mood='失落';msg='你拒绝了'+c.name+'。好感-4';}
  else if(action==='family_yes'){c.favor=clamp(c.favor+7,0,100);c.mood='欢喜';msg='你允许'+c.name+'家人入宫。好感+7';}
  else if(action==='family_no'){c.favor=clamp(c.favor-5,0,100);c.mood='忧愁';msg='你不许'+c.name+'见家人。好感-5';}
  else if(action==='child_yes'){var hc=state.children.filter(function(x){return x.alive&&x.motherId===c.id;});if(hc.length){var ch=pick(hc);ch.character=clamp(ch.character+ri(2,5),0,100);}c.favor=clamp(c.favor+5,0,100);c.mood='欢喜';msg='你去看望了孩子，'+c.name+'欣慰。好感+5';}
  else if(action==='child_no'){c.favor=clamp(c.favor-4,0,100);c.mood='幽怨';msg='你拒绝了'+c.name+'。好感-4';}
  else if(action==='help_yes'){c.favor=clamp(c.favor+8,0,100);c.mood='欢喜';e.power=Math.max(0,e.power-2);msg='你从轻发落'+c.name+'家人。好感+8，势力-2';}
  else if(action==='help_no'){c.favor=clamp(c.favor-6,0,100);c.mood='怨恨';c.punished=true;e.power=clamp(e.power+2,0,100);msg='你按律处置'+c.name+'家人。好感-6，势力+2';}
  state.logs.push('【妃子请求】'+msg);
  alert(msg);
  closeModal();render();
}

function triggerActiveBehavior(){
  var alive=state.consorts.filter(function(c){return c.alive&&!c.pregnant&&!c.inColdPalace;});
  if(!alive.length) return null;  
  if(Math.random()>0.4) return null;
  var c=pick(alive);
  var events=[
    {w:3,fn:function(){state.emperor.health=clamp(state.emperor.health+ri(2,5),0,100);c.favor=clamp(c.favor+3,0,100);c.memories.push('亲手熬了一盅汤，遣人送来。');return {title:'送汤',text:c.name+'遣人送来一盅亲手熬的汤。健康+，好感+3'};}},
    {w:2,fn:function(){c.favor=clamp(c.favor+2,0,100);c.memories.push('求见皇上，说了会儿话。');return {title:'求见',text:c.name+'求见，与你说了一炷香的话。好感+2'};}},
    {w:2,fn:function(){c.favor=clamp(c.favor+3,0,100);state.emperor.charm=clamp(state.emperor.charm+1,0,100);c.memories.push('抄了一首诗呈上。');return {title:'献诗',text:c.name+'亲手抄了一首诗呈上。好感+3，魅力+1'};}},
    {w:2,fn:function(){
      var others=state.consorts.filter(function(x){return x.alive&&x.id!==c.id;});
      if(!others.length) return {title:'独白',text:c.name+'独自坐了一夜。'};
      var t=pick(others);
      var r=getRel(c.id,t.id);
      r.score=clamp(r.score-8,-100,100);
      c.memories.push('向皇上哭诉'+t.name+'欺辱她。');
      return {title:'告状',text:c.name+'向你哭诉'+t.name+'欺辱她。两人关系恶化。'};
    }},
    {w:1,fn:function(){if(state.emperor.gold<500) return {title:'献礼',text:c.name+'想献礼却囊中羞涩。'};state.emperor.gold+=300;c.gold=Math.max(0,c.gold-300);c.favor=clamp(c.favor+2,0,100);c.memories.push('献上家传玉器一件。');return {title:'献礼',text:c.name+'献上一件家传玉器。国库+300，好感+2'};}},
    {w:2,fn:function(){c.mood='思念';c.memories.push('独自在宫门外站了许久，望着皇上宫中的方向。');return {title:'遥望',text:c.name+'独自在宫门外站了许久，望着你宫中的方向。好感不变。'};}},
    {w:1,fn:function(){var g=ri(1,3);c.power=clamp(c.power+g,0,100);c.memories.push('与几位宫女闲话，说了些从前的事。');return {title:'闲话',text:c.name+'与宫女闲话，说了些从前的事。势力+'+g};}},
    {w:2,fn:function(){
      var g=ri(1,3);
      c.favor=clamp(c.favor+g,0,100);
      c.memories.push('绣了个香囊，托人送去。');
      return {title:'香囊',text:c.name+'亲手绣了个香囊托人送来。好感+'+g};
    }},
    {w:1,fn:function(){
      if(c.health<80){var h=ri(2,5);c.health=clamp(c.health+h,0,100);c.memories.push('在院中习练'+c.talent+'。');return {title:'习练',text:c.name+'在院中习练'+c.talent+'。体质+'+h};}
      return {title:'静养',text:c.name+'今日在宫中静养。'};
    }},
    {w:1,fn:function(){
      var k=state.children.filter(function(x){return x.alive&&x.motherId===c.id;});
      if(!k.length) return {title:'思念',text:c.name+'盼着有个孩子，独自坐了半晌。'};
      var kid=pick(k);
      kid.favor=clamp(kid.favor+2,0,100);
      c.memories.push('带着'+kid.name+'玩了一会儿。');
      kid.memories=kid.memories||[];
      kid.memories.push('母亲'+c.name+'带他/她玩了一会儿。');
      return {title:'母子',text:c.name+'带着'+kid.name+'玩了一会儿。'+kid.name+'好感+2'};
    }}
  ];
  var total=events.reduce(function(s,e){return s+e.w;},0);
  var r=Math.random()*total,chosen=events[0];
  for(var i=0;i<events.length;i++){r-=events[i].w;if(r<=0){chosen=events[i];break;}}
  return chosen.fn();
}
// ==================== 节日妃子献艺 ====================
function festivalConsortPerformance(festivalName, contextText){
  // 候选妃子：排除怀孕、月子、冷宫、体弱
  var pool = state.consorts.filter(function(c){
    return c.alive && !c.inColdPalace && !c.pregnant &&
           c.postpartumUntil <= absXun() && c.health >= 30;
  });
  if(!pool.length){
    alert('后宫无妃可献艺。');
    closeModal(); render();
    return;
  }
  var shuffled = pool.slice().sort(function(){return Math.random()-0.5;});
  var n = Math.min(shuffled.length, ri(3,5));
  var candidates = shuffled.slice(0,n);
  // 每个妃子的评分 = 才艺加成 + 魅力 + 好感/2 + 随机
  var scored = candidates.map(function(c){
    var talentBonus = c.talent ? 20 : 0;
    var score = talentBonus + c.charm + Math.round(c.favor/2) + ri(0,30);
    return {c:c, score:score};
  });
  scored.sort(function(a,b){return b.score-a.score;});
  var best = scored[0];
  
  var html='<h4>🎭 '+festivalName+' · 妃嫔献艺</h4>';
  html+='<div style="white-space:pre-line;color:#c9b48a;font-size:13px;line-height:1.8;margin-bottom:12px;border-left:3px solid #c9a227;padding-left:10px">'+contextText+'</div>';
  html+='<div style="font-size:12px;color:#e8c96a;margin-bottom:8px">各宫娘娘献艺，皇后品评如下：</div>';
  scored.forEach(function(s,idx){
    var isBest = s.c.id === best.c.id;
    var medal = ['🥇','🥈','🥉','·','·'][idx] || '·';
    var tag = isBest ? ' <span style="color:#e8c96a">【最佳】</span>' : '';
    html+='<div style="background:rgba(201,162,39,'+(isBest?'.15':'.06')+');border:1px solid '+(isBest?'#c9a227':'#4a3a28')+';border-radius:4px;padding:8px 10px;margin:4px 0;font-size:12px;color:#c9b48a">'+
      medal+' <b style="color:#e8c96a">'+s.c.name+'</b>（'+RANKS[s.c.rankIdx]+'）'+tag+'<br>'+
      '<span style="color:#9a8c78">才艺：'+(s.c.talent||'无')+' · 魅力：'+s.c.charm+' · 好感：'+Math.round(s.c.favor)+' · 评分：'+s.score+'</span>'+
      '</div>';
  });
  html+='<div style="color:#e8c96a;font-size:13px;margin:12px 0 8px">请皇上钦点：</div>';
  html+='<button class="choice" style="background:rgba(201,162,39,.2);border-color:#c9a227" onclick="resolveFestivalPerformance('+best.c.id+')">🎋 采纳最佳者 '+best.c.name+'（召其侍寝，加孕率）</button>';
  html+='<button class="choice" style="background:#2a1815;text-align:center" onclick="resolveFestivalPerformance(0)">雨露均沾（不钦点，各好感+2）</button>';
  html+='<div class="section-head">改选其他妃子为最佳：</div>';
  scored.forEach(function(s){
    if(s.c.id === best.c.id) return;
    html+='<button class="choice" onclick="resolveFestivalPerformance('+s.c.id+')">钦点 '+s.c.name+'（'+(s.c.talent||'无')+'）</button>';
  });
  state._festivalPerfCandidates = scored;
  state._festivalPerfBestId = best.c.id;
  replaceModal(html);
}
function resolveFestivalPerformance(cid){
  var candidates = state._festivalPerfCandidates || [];
  state._festivalPerfCandidates = null;
  state._festivalPerfBestId = null;
  if(!cid){
    // 雨露均沾
    candidates.forEach(function(s){
      s.c.favor = clamp(s.c.favor + 2, 0, 100);
      s.c.memories.push('节日献艺，皇上雨露均沾。');
    });
    alert('你没有钦点最佳者，各宫娘娘皆得赏赐，好感+2。');
    closeModal(); render();
    return;
  }
  var winner = null;
  candidates.forEach(function(s){ if(s.c.id === cid) winner = s.c; });
  if(!winner){ closeModal(); return; }
  // 最佳者获得侍寝 + 孕率
  winner.favor = clamp(winner.favor + 10, 0, 100);
  winner.mood = '爱慕';
  winner.lastVisit = absXun();

function resolveRebellion(childId,action){
  var ch=state.children.find(function(c){return c.id===childId;});

  var e=state.emperor,msg='';
  if(action==='crush'){
    if(e.power<30||e.gold<5000){alert('势力或国库不足');return;}
    e.power-=30;e.gold-=5000;ch.alive=false;ch.rebel=false;
    msg='你派兵镇压了'+ch.name+'的谋反，皇子伏诛。';

}

// ==================== 子嗣排行与命名 ====================
function getChildRank(ch){
  var sameGender=state.children.filter(function(x){return x.alive && x.gender===ch.gender;});
  sameGender.sort(function(a,b){
    if(a.birthYear!==b.birthYear) return a.birthYear-b.birthYear;
    if(a.birthDay!==b.birthDay) return a.birthDay-b.birthDay;
    return a.id-b.id;
  });  
  var sameType=sameGender.filter(function(x){return x.isDi===ch.isDi;});
  var idx=-1;
  for(var i=0;i<sameType.length;i++){if(sameType[i].id===ch.id){idx=i;break;}}
  if(idx<0) idx=0;
  var ordinal=['','长','次','三','四','五','六','七','八','九','十'];
  var ord=ordinal[idx+1]||(idx+1);
  return (ch.isDi?'嫡':'庶')+ord+(ch.gender==='男'?'子':'女');
}

function showNextNaming(){

        replaceModal(nextData.birthHtml);
        return;
      }
    }
    closeModal(); // 核心修复：关闭弹窗！
    render();
    return;
  }
  var ch = state.namingQueue[0];
  if(!ch || !ch.alive){ state.namingQueue.shift(); showNextNaming(); return; }
  var pool = ch.gender==='男' ? CHILD_NAMES_M : CHILD_NAMES_F;
  var opts=[];
  var seen={};
  var guard=0;
  while(opts.length<6 && guard<100){
    guard++;
    // 核心修复：60%概率生成双字名，40%概率生成单字名
    var n;
    if (Math.random() < 0.6) {
      var c1 = pool[Math.floor(Math.random()*pool.length)];
      var c2 = pool[Math.floor(Math.random()*pool.length)];
      var tries = 0;
      while (c1 === c2 && tries < 10) {
        c2 = pool[Math.floor(Math.random()*pool.length)];
        tries++;
      }
      n = c1 + c2; // 组合成双字名
    } else {
      n = pool[Math.floor(Math.random()*pool.length)];
    }
    if(seen[n]) continue;
    seen[n]=1;

function checkChildGrowth(){
  if(state.day!==1) return;
  if(!state._pendingChildEventQueue) state._pendingChildEventQueue=[];
  state.children.filter(function(c){return c.alive;}).forEach(function(ch){
    var age=state.year-ch.birthYear;
    if(age===6 && ch.eduStage===0){ ch.eduStage=1; state._pendingChildEventQueue.push({type:'teacher',cid:ch.id}); }
    else if(age===12 && ch.eduStage===1){ ch.eduStage=2; state._pendingChildEventQueue.push({type:'ritual',cid:ch.id}); }
    else if(age===16 && ch.eduStage===2){ ch.eduStage=3; state._pendingChildEventQueue.push({type:'career',cid:ch.id}); }
    if(age>=6){
      var litGain=Math.max(0,Math.min(20,Math.round(ch.intel/8+ri(-1,4))));
      var marGain=Math.max(0,Math.min(20,Math.round(ch.health/8+ri(-1,4))));
      if(ch.teacher==='文师') litGain+=ri(6,12);
      else if(ch.teacher==='武师') marGain+=ri(6,12);
      else if(ch.teacher==='杂学'){ ch.intel=Math.min(100,ch.intel+ri(1,3)); ch.character=Math.min(100,ch.character+ri(1,2)); }
      if(ch.career==='朝堂'){ litGain+=3; ch.power=Math.max(0,ch.power+3); ch.ambition=Math.min(100,ch.ambition+2); }
      else if(ch.career==='戍边'){ marGain+=3; ch.health=Math.min(100,ch.health+2); }
      else if(ch.career==='闲居'){ ch.favor=Math.min(100,ch.favor+2); ch.ambition=Math.max(0,ch.ambition-1); }
      else if(ch.career==='外放'){ ch.power=Math.max(0,ch.power+2); }
      ch.literary+=litGain;
      ch.martial+=marGain;
    }
    if(age<5 && Math.random()<0.02){
      ch.alive=false;
      state.logs.push('【子嗣】'+ch.name+'不幸夭折。');
    }
  });
}

function triggerKidnap(){
  var kids=state.children.filter(function(k){return k.alive && (state.year-k.birthYear)<=18;});
  if(!kids.length) return;
  var kid=pick(kids);
  var mom=state.consorts.find(function(c){return c.id===kid.motherId && c.alive;});
  var others=state.consorts.filter(function(c){return c.alive && !c.inColdPalace && (!mom || c.id!==mom.id);});
  if(!others.length) return;
  var n=Math.min(others.length, ri(1,3));
  var suspects=others.slice().sort(function(){return Math.random()-0.5;}).slice(0,n);
  state.pendingCrime={
    type:'kidnap', victimId:kid.id, victimIsChild:true,
    motherId: mom?mom.id:-1,
    suspectIds: suspects.map(function(s){return s.id;}),
    culpritId: pick(suspects).id,
    startXun: absXun()
  };
  var html='<h4>🆘 后宫疑案 · 绑架皇嗣</h4>';
  html+='<div style="white-space:pre-line;color:#c9b48a;font-size:13px;line-height:1.8;margin-bottom:12px;border-left:3px solid #c94a5a;padding-left:10px">'+

  html+='<div style="font-size:12px;color:#9a8c78;margin-bottom:12px">嫌疑人：'+suspects.map(function(s){return s.name+'（'+RANKS[s.rankIdx]+'）';}).join('、')+'</div>';
  html+='<button class="choice" onclick="resolveKidnap(\'investigate\')">全力搜捕、彻查（一旬后出结果）</button>';
  html+='<button class="choice" onclick="resolveKidnap(\'blockade\')">封锁宫门，密令心腹暗中查探（一旬后出结果）</button>';
  html+='<button class="choice" onclick="resolveKidnap(\'ignore\')">不予理会</button>';
  openModal(html);
  state.logs.push('【宫斗】皇嗣'+kid.name+'遭绑架！');
}
function resolveKidnap(action){
  var crime=state.pendingCrime;
  if(!crime||crime.type!=='kidnap'){closeModal();return;}
  var kid=state.children.find(function(x){return x.id===crime.victimId;});
  if(!kid){state.pendingCrime=null;closeModal();return;}
  if(action==='investigate'){
    crime.investigationStarted=true;
    state.logs.push('【宫斗】全力搜捕皇嗣被绑架案。');
    alert('你下令彻查，约一旬后出结果。');
    closeModal();render();return;
  }
  if(action==='blockade'){
    crime.investigationStarted=true;
    state.logs.push('【宫斗】封锁宫门，密令心腹暗中查探皇嗣被绑架案。');
    alert('你下令封锁宫门，不许走漏风声，密令心腹暗中查探。\n约一旬后出结果。');
    closeModal();render();return;
  }
  var dmg2=ri(10,25);

    alert('你赏赐'+victim.name+'以作安抚，她心中宽慰。');
    closeModal();render();
    return;
  }

  if(action==='ignore'){
    victim.favor=clamp(victim.favor-5,0,100);

    victim.memories.push('遭人暗算，皇上却不闻不问。');

  state.logs.push('【宫斗】皇上派人暗中调查'+victim.name+'的案子，约一旬后出结果。');

}

function tickCrimeInvestigation(){
  var crime=state.pendingCrime;
  if(!crime || !crime.investigationStarted) return;
  if(absXun()-crime.startXun<1) return;
  if(crime.type==='kidnap') return tickKidnapInvestigation(crime);
  if(crime.type==='adultery') return tickAdulteryInvestigation(crime);
  if(crime.type==='fakePregnant') return tickFakePregnantInvestigation(crime);
  var victim=state.consorts.find(function(c){return c.id===crime.victimId;});
  var culprit=state.consorts.find(function(c){return c.id===crime.culpritId;});
  if(!victim||!culprit){state.pendingCrime=null;return;}
  victim.memories=victim.memories||[];
  culprit.memories=culprit.memories||[];

  // 计算暴露概率：智力越高越容易逃脱
  var chance=0.65;
  if(culprit.intel>80) chance=0.25;
  else if(culprit.intel>60) chance=0.45;
  if(culprit.ambition>80) chance+=0.1;
  if(culprit.per==='机敏'||culprit.per==='深沉') chance+=0.1;
  var exposed=Math.random()<chance;

  // 根据类型给受害者施加伤害
  var dmgInfo='';
  if(crime.type==='poison'){
    var hd=ri(5,15);
    victim.health=clamp(victim.health-hd,0,100);
    victim.fertility=Math.max(0,(victim.fertility||0)-ri(10,25));
    dmgInfo='体质-'+hd+'，孕率受损。';
    if(victim.health<25 && Math.random()<0.3){
      victim.alive=false;
      dmgInfo+=' 毒发身亡！';
      state.logs.push('【宫斗】'+victim.name+'毒发身亡。');
    }
  } else if(crime.type==='gu'){
    var hd2=ri(3,8);
    victim.health=clamp(victim.health-hd2,0,100);
    victim.mood='哀伤';
    dmgInfo='体质-'+hd2+'，心神不宁。';
  } else if(crime.type==='arson'){
    // 运气50%，实力50%
    var luck=Math.random()<0.5?1:-1;
    var strength=(culprit.power+culprit.intel+victim.health)/3;
    var strengthMod=strength>60?-1:1;
    var result=(luck+strengthMod)/2;
    if(result>0.3){ dmgInfo='火势被及时扑灭，'+victim.name+'只受了些惊吓。'; }
    else if(result>-0.3){
      var hd3=ri(8,18);
      victim.health=clamp(victim.health-hd3,0,100);
      dmgInfo=''+victim.name+'被浓烟呛伤，体质-'+hd3+'。';
    } else {
      var hd4=ri(20,40);
      victim.health=clamp(victim.health-hd4,0,100);
      dmgInfo='火势凶猛，'+victim.name+'被烧伤，体质-'+hd4+'。';
      if(victim.health<20 && Math.random()<0.5){
        victim.alive=false;
        dmgInfo+=' 伤重不治！';
        state.logs.push('【宫斗】'+victim.name+'在火灾中伤重不治。');
      }
    }
  }
  victim.memories.push('【受害】'+dmgInfo);

  var html='<h4>🔍 调查结果 · '+CRIME_TYPES[crime.type]+'</h4>';
  if(exposed){
    html+='<div style="color:#c9b48a;font-size:13px;line-height:1.8;margin-bottom:12px;border-left:3px solid #c9a227;padding-left:10px">'+
      '经一番暗查，真相大白：<br>'+culprit.name+'（'+RANKS[culprit.rankIdx]+'）确为此事主谋。\n'+dmgInfo+'</div>';
    html+='<div style="color:#e8c96a;font-size:13px;margin-bottom:8px">如何处置？</div>';
    html+='<button class="choice" onclick="resolveCrimeJudgment(\'strict\')">依律严惩（降位+禁足一年+杖刑）</button>';
    html+='<button class="choice" onclick="resolveCrimeJudgment(\'lenient\')">从轻发落（降位+罚俸）</button>';
    html+='<button class="choice" onclick="resolveCrimeJudgment(\'ignore\')">压下此事</button>';
  } else {
    html+='<div style="color:#c9b48a;font-size:13px;line-height:1.8;margin-bottom:12px;border-left:3px solid #6a5a3a;padding-left:10px">'+
      '查了一旬，未得实据。此事只得不了了之。\n'+dmgInfo+'</div>';
    html+='<button class="choice" onclick="resolveCrimeJudgment(\'none\')">罢了</button>';
  }
  state._crimeResult={crime:crime, victimId:victim.id, culpritId:culprit.id, exposed:exposed};
  openModal(html);
}

function resolveCrimeJudgment(action){
  var r=state._crimeResult;
  if(!r){closeModal();return;}
  var victim=state.consorts.find(function(c){return c.id===r.victimId;});
  var culprit=state.consorts.find(function(c){return c.id===r.culpritId;});
  if(!victim||!culprit){state._crimeResult=null;state.pendingCrime=null;closeModal();return;}
  victim.memories=victim.memories||[];
  culprit.memories=culprit.memories||[];
  var msg='';
  if(action==='strict' && r.exposed){
    // 降位
    if(culprit.rankIdx<RANKS.length-1) culprit.rankIdx++;
    culprit.groundedUntil=absXun()+36;  // 禁足一年
    culprit.power=clamp(culprit.power-15,0,100);
    culprit.favor=clamp(culprit.favor-20,0,100);
    culprit.health=clamp(culprit.health-15,0,100);  // 杖刑
    culprit.mood='怨恨';
    culprit.memories.push('【事发】对'+victim.name+'行'+CRIME_TYPES[r.crime.type]+'之事败露，被严惩。');
    victim.mood='得意';
    victim.memories.push('皇上为自己做主，'+culprit.name+'被严惩。');
    msg='依律严惩，'+culprit.name+'被降位、禁足、杖刑，宫中人人称快。';
  } else if(action==='lenient' && r.exposed){
    if(culprit.rankIdx<RANKS.length-1) culprit.rankIdx++;
    culprit.power=clamp(culprit.power-5,0,100);
    culprit.favor=clamp(culprit.favor-8,0,100);
    culprit.salaryUntil=absXun()+9;
    culprit.memories.push('【事发】对'+victim.name+'行'+CRIME_TYPES[r.crime.type]+'之事被查，皇上从轻发落。');
    victim.mood='幽怨';
    victim.memories.push('皇上从轻发落此事，心中不平。');
    msg='从轻发落，'+culprit.name+'受了薄惩。';
  } else if(action==='ignore' && r.exposed){
    culprit.memories.push('【事发】对'+victim.name+'下手之事被查，但皇上压下不问。');
    victim.memories.push('皇上压下此事，不再追究。');
    msg='你将此事压下。';
  } else {
    msg='查无实据，此事不了了之。';
    if(victim) victim.memories.push('此事终无结果。');
  }
  state.logs.push('【宫斗】'+msg);
  alert(msg);
  state._crimeResult=null;
  state.pendingCrime=null;
  closeModal();
  assignPalaces();updateFactionPower();render();
}

function resolveAssassination(action){
  var r=state._assassinationResult;
  if(!r){closeModal();return;}
  var culprit=state.consorts.find(function(x){return x.id===r.culpritId;});
  if(!culprit){state._assassinationResult=null;closeModal();return;}
  var msg='';
  if(action==='punish' && r.exposed){
    culprit.alive=false;
    state.emperor.power=Math.max(0,state.emperor.power-20);
    msg='你赐死了'+culprit.name+'，势力-20。';
  } else if(action==='lenient' && r.exposed){
    culprit.inColdPalace=true;
    culprit.power=0;
    state.emperor.power=Math.max(0,state.emperor.power-10);
    msg='你将'+culprit.name+'打入冷宫，势力-10。';
  } else if(action==='ignore' && r.exposed){
    msg='你压下此事，未追究'+culprit.name+'。';
  } else {
    msg='查无实据，此事不了了之。';
  }
  state.logs.push('【刺杀】'+msg);

  state._assassinationResult=null;
  closeModal(); render();
}

function giveBirth(c){
  var e=state.emperor;

  var early = Math.random()<0.20; // 20% 早产
  var late = !early && Math.random()<0.20; // 20% 晚产
  var diffFlag = Math.random()<diff; // 难产
  var earlyLate = early?'早产':(late?'晚产':'顺产');
  var situation = diffFlag ? (earlyLate+'，且难产') : earlyLate;
  // 早产/晚产会略影响孩子起始属性
  c.memories=c.memories||[];

  if(diffFlag && Math.random()<0.4){

    var dmg=ri(5,15);

    var g=genders[i]||(Math.random()<0.5?'男':'女');

    var child=genChild(c,g);
    if(early){ child.intel=Math.max(10,child.intel-ri(2,8)); child.health=Math.max(20,child.health-ri(2,8)); }
    if(late){ child.health=clamp(child.health+ri(0,5),0,100); }

  e.mood=clamp(e.mood+10,0,100);e.gold+=count*500;
