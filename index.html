function showConsortTitleSelect(cid) {
  var c = state.consorts.find(function(x){return x.id===cid;});
  if(!c) return;
  var opts = [];
  var seen = {};
  var guard = 0;
  while(opts.length<5 && guard<80){
    guard++;
    var n = Math.random()<0.6 ? pick(TITLE_CHARS) : (pick(TITLE_CHARS)+pick(TITLE_CHARS));
    if(seen[n]) continue;
    seen[n]=1;
    opts.push(n);
  }
  var html='<h4>内务府拟封号</h4>';
  html+='<div style="font-size:13px;color:#c9b48a;margin-bottom:10px">因'+c.name+'诞下皇嗣，拟赐封号，请皇上御笔钦定：</div>';
  opts.forEach(function(n){
    html+='<button class="choice" onclick="doConsortTitleSelect('+cid+',\''+n+'\')">'+n+'</button>';
  });
  html+='<div style="margin-top:15px;text-align:right"><button onclick="skipConsortTitle()">暂不赐号</button></div>';
  replaceModal(html);
}
function doConsortTitleSelect(cid, t) {
  var c = state.consorts.find(function(x){return x.id===cid;});
  var data = state._pendingReward;
  if(!c) { closeModal(); return; }
  
  c.title = t;
  c.power = clamp(c.power+1, 0, 100);
  c.favor = clamp(c.favor+2, 0, 100);
  c.memories.push('因诞下皇嗣，赐封号「'+t+'」，势力+1，好感+2。');
  state.logs.push('【嘉奖】'+c.name+'赐封号「'+t+'」。');
  
  state._pendingReward = null;
  assignPalaces();
  updateFactionPower();
  
  alert(c.name+'赐封号「'+t+'」，势力+1，好感+2。');

// ==================== 冷宫大赦 ====================
function triggerAmnesty(reason){
  var inmates = state.consorts.filter(function(c){return c.alive && c.inColdPalace;});
  if(!inmates.length) return false;
  var n = Math.min(inmates.length, ri(1,2));
  var shuffled = inmates.slice().sort(function(){return Math.random()-0.5;});
  var freed = shuffled.slice(0, n);
  freed.forEach(function(c){
    c.inColdPalace = false;
    c.power = ri(3,10);
    c.mood = '平静';
    c.favor = clamp(c.favor+5, 0, 100);
    var oldRank = RANKS[c.rankIdx];
    c.rankIdx = RANKS.length-1; // 放出冷宫后从最低位分重新开始
    c.memories = c.memories || [];
    c.memories.push('因'+reason+'，被赦出冷宫，由'+oldRank+'降为'+RANKS[c.rankIdx]+'。');
  });
  state.logs.push('【大赦】因'+reason+'，'+freed.map(function(c){return c.name;}).join('、')+'被放出冷宫。');
  return true;
}

// ==================== 外戚系统 ====================
function tickWaiqi(){
  if(state.day!==1) return;
  state.consorts.filter(function(c){return c.alive && !c.inColdPalace && c.father;}).forEach(function(c){
    var f = c.father;
    var gain = Math.floor(f.power/40);
    if(gain>0) c.power = clamp(c.power + gain, 0, 100);
    if(f.loyalty > 50) f.loyalty += ri(-2,1); else f.loyalty += ri(-1,1);
    f.loyalty = clamp(f.loyalty, 0, 100);
    if(c.favor > 60) f.power = Math.min(100, f.power + ri(0,2));
    else if(c.favor < 20) f.power = Math.max(0, f.power - ri(0,2));
    if(c.power > 60 && f.rank > 1 && Math.random()<0.10){
      f.rank--;
      c.memories = c.memories || [];
      c.memories.push('父兄晋为'+COURT_RANK_NAMES[f.rank]+'。');
      state.logs.push('【外戚】'+c.name+'之父晋为'+COURT_RANK_NAMES[f.rank]+'。');
    }
  });
}

  addHistory('外戚风波：'+msg);
  state._pendingWaiqiCrisis = null;
  alert(msg);
  closeModal();render();
}

// ==================== 废储风波 ====================
function checkPendingCrownCrisis(){
  if(!state._pendingCrownCrisis) return false;
  var crown = state.children.find(function(c){return c.id===state._pendingCrownCrisis;});
  if(!crown || !crown.alive){ state._pendingCrownCrisis=null; return false; }
  var html='<h4>⚠ 废储风波</h4>';
  html+='<div style="white-space:pre-line;color:#c9b48a;font-size:13px;line-height:1.8;margin-bottom:12px;border-left:3px solid #c94a5a;padding-left:10px">近来朝野议论纷纷，太子'+crown.name+'失德失仪，多位大臣联名上奏，请皇上废储另立。\n（太子稳定度仅'+state.crownStability+'）</div>';
  html+='<button class="choice" onclick="resolveCrownCrisis(\'protect\')">力保太子（太子稳定+20，太子好感+10）</button>';
  html+='<button class="choice" onclick="resolveCrownCrisis(\'rebuke\')">训斥太子（太子稳定+10，太子势力-10，好感-15）</button>';
  html+='<button class="choice" onclick="resolveCrownCrisis(\'demote\')">废黜太子（太子被废，诸皇子野心+10）</button>';
  replaceModal(html);
  return true;
}
function resolveCrownCrisis(action){
  var crown = state.children.find(function(c){return c.id===state._pendingCrownCrisis;});
  if(!crown){ state._pendingCrownCrisis=null; closeModal(); return; }
  var msg='';
  if(action==='protect'){
    state.crownStability = Math.min(100, state.crownStability + 20);
    crown.favor = Math.min(100, crown.favor + 10);
    crown.memories.push('父皇力保太子之位，心中感激。');
    msg='你力保太子，朝野议论暂息。太子稳定+20。';
  } else if(action==='rebuke'){
    state.crownStability = Math.min(100, state.crownStability + 10);
    crown.power = Math.max(0, crown.power - 10);
    crown.favor = Math.max(0, crown.favor - 15);
    crown.ambition = Math.min(100, crown.ambition + 5);
    crown.memories.push('父皇当众训斥，颜面尽失。');
    msg='你当众训斥太子，稳定回升，但太子对你颇有怨言。';
  } else {
    // 废储
    state.crownPrince = null;
    state.crownStability = 100;
    crown.memories.push('被废黜太子之位。');
    state.children.filter(function(c){return c.alive && c.gender==='男';}).forEach(function(c){
      c.ambition = Math.min(100, c.ambition + 10);
    });
    msg='你废黜了太子'+crown.name+'，诸皇子野心大涨。';
  }
  state.logs.push('【废储】'+msg);
  addHistory('废储：'+msg);
  state._pendingCrownCrisis = null;
  alert(msg);
  closeModal();render();
}

// ==================== 外戚谋反 ====================
function checkPendingWaiqiRebellion(){
  if(!state._pendingWaiqiRebellion) return false;
  var c = state.consorts.find(function(x){return x.id===state._pendingWaiqiRebellion;});
  if(!c || !c.father){ state._pendingWaiqiRebellion=null; return false; }
  var html='<h4>⚔ 外戚谋反</h4>';
  html+='<div style="white-space:pre-line;color:#c9b48a;font-size:13px;line-height:1.8;margin-bottom:12px;border-left:3px solid #c94a5a;padding-left:10px">密探来报：'+c.name+'之父'+c.father.name+'（'+COURT_RANK_NAMES[c.father.rank]+'）近来频繁联络藩王、外将，书信中隐有反意。\n（其势力'+c.father.power+'，忠诚'+c.father.loyalty+'）</div>';
  html+='<button class="choice" onclick="resolveWaiqiRebellion(\'crush\')">先发制人（父兄势力-30，妃好感-25，一次性解决）</button>';
  html+='<button class="choice" onclick="resolveWaiqiRebellion(\'appease\')">怀柔安抚（国库-3000，父兄忠诚+25，妃好感+10）</button>';
  html+='<button class="choice" onclick="resolveWaiqiRebellion(\'strip\')">削权贬斥（父兄势力-15、忠诚-10，妃好感-15，20%概率激反）</button>';
  html+='<button class="choice" onclick="resolveWaiqiRebellion(\'ignore\')">装聋作哑（40%概率真的反叛）</button>';
  replaceModal(html);
  return true;
}
function resolveWaiqiRebellion(action){
  var c = state.consorts.find(function(x){return x.id===state._pendingWaiqiRebellion;});
  if(!c || !c.father){ state._pendingWaiqiRebellion=null; closeModal(); return; }
  var f = c.father;
  var msg='';
  if(action==='crush'){
    f.power = Math.max(0, f.power - 30);
    f.loyalty = Math.min(100, f.loyalty + 10);
    c.favor = Math.max(0, c.favor - 25);
    c.mood = '怨恨';
    msg='你先发制人，将'+f.name+'削职拿办，其党羽一哄而散。妃心怀怨恨。';
  } else if(action==='appease'){
    if(state.emperor.gold < 3000){ alert('国库不足'); return; }
    state.emperor.gold -= 3000;
    f.loyalty = Math.min(100, f.loyalty + 25);
    c.favor = Math.min(100, c.favor + 10);
    msg='你加封赏赐，'+f.name+'暂息反意。国库-3000。';
  } else if(action==='strip'){
    f.power = Math.max(0, f.power - 15);
    f.loyalty = Math.max(0, f.loyalty - 10);
    c.favor = Math.max(0, c.favor - 15);
    c.mood = '幽怨';
    if(Math.random()<0.20){
      f.power = Math.min(100, f.power + 30);
      f.loyalty = 0;
      state.emperor.power = Math.max(0, state.emperor.power - 15);
      state.emperor.gold = Math.max(0, state.emperor.gold - 5000);
      msg='你削其权柄，'+f.name+'被激反！叛军四起，朝野震动。势力-15，国库-5000。';
    } else {
      msg='你削权贬斥，'+f.name+'暂时收敛。';
    }
  } else {
    if(Math.random()<0.40){
      f.power = Math.min(100, f.power + 30);
      state.emperor.power = Math.max(0, state.emperor.power - 20);
      state.emperor.gold = Math.max(0, state.emperor.gold - 8000);
      state.emperor.mood = Math.max(0, state.emperor.mood - 15);
      msg=f.name+'真的反了！叛军攻破三城，朝野震动。势力-20，国库-8000。';
    } else {
      msg='你装聋作哑，'+f.name+'暂时按兵不动。';
    }
  }
  state.logs.push('【外戚】'+msg);
  addHistory('外戚谋反：'+msg);
  state._pendingWaiqiRebellion = null;
  alert(msg);
  closeModal();render();
}

// ==================== 外放凯旋 ====================
function checkPendingExileReturn(){
  if(!state._pendingExileReturnQueue || !state._pendingExileReturnQueue.length) return false;
  var cid = state._pendingExileReturnQueue[0];
  var ch = state.children.find(function(x){return x.id===cid;});
  if(!ch || !ch.alive){ state._pendingExileReturnQueue.shift(); return checkPendingExileReturn(); }
  var html='<h4>🏇 凯旋回京 · '+ch.name+'</h4>';
  html+='<div style="white-space:pre-line;color:#c9b48a;font-size:13px;line-height:1.8;margin-bottom:12px;border-left:3px solid #c9a227;padding-left:10px">'+ch.name+'外放六年，戍守边关，如今功成归来，请旨入京面圣。\n（其势力'+ch.power+'，野心'+ch.ambition+'）</div>';
  html+='<button class="choice" onclick="resolveExileReturn(\'restore\')">恢复身份，嘉奖其功（势力+20，野心+15）</button>';
  html+='<button class="choice" onclick="resolveExileReturn(\'keep\')">继续外放，留任边关（势力+10，野心-5）</button>';
  html+='<button class="choice" onclick="resolveExileReturn(\'strip\')">削其兵权，留京闲居（势力-10，好感-20，野心+5）</button>';
  replaceModal(html);
  return true;
}
function resolveExileReturn(action){
  var cid = state._pendingExileReturnQueue[0];
  var ch = state.children.find(function(c){return c.id===cid;});
  if(!ch){ state._pendingExileReturnQueue.shift(); closeModal(); return; }
  ch.memories = ch.memories || [];
  var msg='';
  if(action==='restore'){
    ch.career = '朝堂';
    ch.careerStartYear = state.year;
    ch.power = Math.max(0, ch.power + 20);
    ch.ambition = Math.min(100, ch.ambition + 15);
    ch.memories.push('外放期满，凯旋回京，父皇嘉奖，复入朝堂。');
    msg='你恢复'+ch.name+'身份，嘉奖其功。势力+20，野心+15。';
  } else if(action==='keep'){
    ch.careerStartYear = state.year;
    ch.power = Math.max(0, ch.power + 10);
    ch.ambition = Math.max(0, ch.ambition - 5);
    ch.memories.push('外放期满，父皇命其继续留任边关。');
    msg='你命'+ch.name+'继续外放边关。势力+10，野心-5。';
  } else {
    ch.career = '闲居';
    ch.careerStartYear = state.year;
    ch.power = Math.max(0, ch.power - 10);
    ch.favor = Math.max(0, ch.favor - 20);
    ch.ambition = Math.min(100, ch.ambition + 5);
    ch.memories.push('外放期满，兵权被削，留京闲居，心中郁闷。');
    msg='你削去'+ch.name+'兵权，留京闲居。势力-10，好感-20，野心+5。';
  }
  state.logs.push('【夺嫡】'+msg);
  addHistory('外放凯旋：'+msg);
  state._pendingExileReturnQueue.shift();
  alert(msg);
  closeModal();
  if(!checkPendingExileReturn()) render();
}

showStartScreen();
</script>
